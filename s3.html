<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
.shot { width:1080px; height:1920px; background:#F4F7F5; color:#12211A;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  position:relative; overflow:hidden; display:flex; flex-direction:column; }
.status { height:88px; display:flex; align-items:center; justify-content:space-between;
  padding:0 56px; font-size:36px; font-weight:700; flex:none; }
.sicons { display:flex; gap:20px; align-items:center; }
.content { flex:1; padding:20px 44px 0; display:flex; flex-direction:column; gap:32px; overflow:hidden; }
.nav { height:198px; background:rgba(255,255,255,.97); border-top:2px solid #E2E9E5;
  display:flex; justify-content:space-around; align-items:center; flex:none; }
.tab { display:flex; flex-direction:column; align-items:center; gap:8px;
  color:#6B7C74; font-size:30px; font-weight:600; }
.tab.on { color:#2FBF71; }
.tab svg { width:64px; height:64px; }
.card { background:#fff; border-radius:56px; padding:44px; box-shadow:0 8px 28px rgba(18,33,26,.05); }
.btn { background:#2FBF71; color:#fff; border-radius:52px; height:150px; display:flex;
  align-items:center; justify-content:center; gap:18px; font-size:51px; font-weight:700;
  box-shadow:0 10px 26px rgba(47,191,113,.30); }
.btn.ghost { background:#fff; color:#12211A; border:3px solid #E2E9E5; box-shadow:none; }
.chip { background:#EDF2EF; color:#12211A; border-radius:100px; padding:16px 34px;
  font-size:33px; font-weight:600; display:inline-flex; align-items:center; gap:12px; }
.chip.on { background:#E3F7EC; color:#1FA35E; }
.mute { color:#6B7C74; }
.green { color:#1FA35E; }
svg { display:block; }
.hdr { font-size:57px; font-weight:800; letter-spacing:-1px; }
.sub { font-size:33px; color:#6B7C74; }
.hrow { display:flex; align-items:center; justify-content:space-between; }
.icobtn { width:96px; height:96px; border-radius:32px; background:#EDF2EF; display:flex;
  align-items:center; justify-content:center; color:#6B7C74; }
.avatar { width:120px; height:120px; border-radius:40px; background:linear-gradient(135deg,#2FBF71,#1FA35E);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:54px; font-weight:800;
  box-shadow:0 8px 20px rgba(47,191,113,.28); }
.inst { display:flex; align-items:center; gap:34px; background:#fff; border-radius:48px;
  padding:34px; box-shadow:0 6px 22px rgba(18,33,26,.05); }
.inst.act { background:#E3F7EC; box-shadow:none; }
.instico { width:128px; height:128px; border-radius:38px; background:#EDF2EF; display:flex;
  align-items:center; justify-content:center; font-size:56px; font-weight:800; color:#6B7C74; flex:none; }
.inst.act .instico { background:#2FBF71; color:#fff; box-shadow:0 8px 20px rgba(47,191,113,.3); }
.play { width:112px; height:112px; border-radius:50%; background:#E3F7EC; display:flex;
  align-items:center; justify-content:center; color:#1FA35E; flex:none; }
.play.solid { background:#2FBF71; color:#fff; box-shadow:0 8px 18px rgba(47,191,113,.3); }
.progress { height:16px; border-radius:8px; background:#EDF2EF; overflow:hidden; }
.progress i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,#2FBF71,#1FA35E); }
.slider { display:flex; align-items:center; gap:28px; }
.strack { flex:1; height:12px; border-radius:6px; background:#EDF2EF; position:relative; }
.strack i { position:absolute; left:0; top:0; height:100%; border-radius:6px; background:#2FBF71; }
.strack b { position:absolute; top:50%; width:52px; height:52px; border-radius:50%; background:#fff;
  border:4px solid #2FBF71; transform:translate(-50%,-50%); box-shadow:0 4px 12px rgba(0,0,0,.15); }
</style>
</head>
