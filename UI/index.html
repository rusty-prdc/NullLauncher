<div id="window">
  <div id="titlebar">
    <div class="tb-drag" data-drag="1">
      <div class="tb-brand">
        <svg class="tb-logo" viewBox="0 0 24 24"><path d="M12 3.2 20 7.6v8.8L12 20.8 4 16.4V7.6z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 9.6v4.8M15 9.6v4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>NullLauncher</span>
      </div>
      <div class="tb-title" id="tb-title">Главная</div>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="tb-min" title="Свернуть"><svg><use href="#i-minus"/></svg><span class="minimize-glyph"></span></button>
      <button class="tb-btn" id="tb-max" title="Развернуть"><span class="maximize-glyph"></span></button>
      <button class="tb-btn tb-close" id="tb-close" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </div>

  <div id="shell">
    <aside id="sidebar">
      <nav id="nav">
        <a class="nav-item" data-route="home"><svg><use href="#i-home"/></svg><span>Главная</span></a>
        <a class="nav-item" data-route="instances"><svg><use href="#i-grid"/></svg><span>Мои сборки</span></a>
        <a class="nav-item" data-route="discover"><svg><use href="#i-compass"/></svg><span>Modrinth</span></a>
        <a class="nav-item" data-route="downloads"><svg><use href="#i-download"/></svg><span>Загрузки</span><em class="nav-badge" id="nav-downloads-badge" hidden></em></a>
        <div class="nav-sep"></div>
        <a class="nav-item" data-route="settings"><svg><use href="#i-settings"/></svg><span>Настройки</span></a>
      </nav>
      <div class="nav-foot">
        <button class="account-chip" id="account-chip" title="Профиль и аккаунты">
          <span class="avatar" id="account-avatar">?</span>
          <span class="account-meta">
            <strong id="account-name">Гость</strong>
            <small id="account-sub">Не вошли</small>
          </span>
        </button>
        <div class="version-chip">NullLauncher <span id="app-version">1.0.0</span></div>
      </div>
    </aside>

    <main id="main">
      <div id="view" class="view"></div>
    </main>
  </div>
</div>

<div id="notify-host" aria-live="polite"></div>
<div id="dialog-host"></div>
<div id="ctx-host"></div>

<div id="palette" hidden>
  <div class="palette-backdrop" data-close="1"></div>
  <div class="palette-box">
    <div class="palette-input">
      <svg><use href="#i-search"/></svg>
      <input id="palette-q" type="text" placeholder="Поиск сборок, модов, настроек…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>

<div id="drop-overlay" hidden>
  <div class="drop-box">
    <svg><use href="#i-upload"/></svg>
    <h3>Перетащите файлы</h3>
    <p>.jar — мод · .zip — ресурс-пак / шейдер · .mrpack — модпак</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
