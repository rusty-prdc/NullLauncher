  function applyJavaVisibility(mode) {
    var b = S.els.body;
    var jm = ui.$("#p-inst-f-jma", b), jp = ui.$("#p-inst-f-jp", b);
    if (jm) jm.style.display = mode === "major" ? "" : "none";
    if (jp) jp.style.display = mode === "path" ? "" : "none";
  }

  function updateRamWarn() {
    var box = ui.$("#p-inst-ramwarn", S.els.body);
    if (!box) return;
    var total = (App.info && App.info.ramTotalMb) || 0;
    var maxEl = ui.$("#p-inst-f-rmax", S.els.body);
    var cust = ui.$("#p-inst-f-rcustom", S.els.body);
    var max = parseInt((cust && cust.value) || (maxEl && maxEl.value) || "0", 10) || 0;
    box.innerHTML = (total && max > total)
      ? '<div class="banner error">' + ic("alert") +
        '<span class="grow">Максимум RAM (' + ui.fmtNum(max) + " МБ) больше доступной памяти (" + ui.fmtNum(total) + " МБ) — игра может не запуститься.</span></div>"
      : "";
  }

  function queueSave(patch) {
    Object.assign(S.saveQueue, patch);
    if (S.saveTimer) clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(flushSave, 400);
  }
  async function saveNow(patch) {
    try {
      var upd = await api("instances.update", Object.assign({ id: S.id }, patch));
      if (S.dead) return null;
      S.inst = upd && upd.id ? upd : Object.assign({}, S.inst, patch);
      var now = Date.now();
      if (now - S.lastToast > 2000) { S.lastToast = now; ui.notifySuccess("Сохранено"); }
      return S.inst;
    } catch (e) { ui.notifyError(e, "Не удалось сохранить"); return null; }
  }
  async function flushSave() {
    S.saveTimer = null;
    var patch = S.saveQueue;
    S.saveQueue = {};
    if (!Object.keys(patch).length) return;
    await saveNow(patch);
  }

  async function loadMcVersions() {
    try {
      var list = (await api("versions.list", { type: "release", limit: 300 })) || [];
      if (S.dead) return;
      S.versions = list;
      fillMcVersions("");
    } catch (e) {
      var sel = ui.$("#p-inst-f-mc", S.els.body);
      if (sel) sel.innerHTML = option(S.inst.mcVersion, S.inst.mcVersion + " · список недоступен", S.inst.mcVersion);
    }
  }
  function fillMcVersions(q) {
    var sel = ui.$("#p-inst-f-mc", S.els.body);
    if (!sel) return;
    q = String(q || "").trim().toLowerCase();
    var arr = S.versions.filter(function (v) { return !q || String(v.id).toLowerCase().indexOf(q) >= 0; }).slice(0, 200);
    if (!arr.length) { sel.innerHTML = option(S.mcPick, S.mcPick, S.mcPick); return; }
    sel.innerHTML = arr.map(function (v) {
      return option(v.id, v.id + (v.installed ? " · установлено" : ""), S.mcPick);
    }).join("");
    if (!arr.some(function (v) { return v.id === S.mcPick; })) sel.value = S.mcPick;
  }

  async function loadLoaderVersions() {
    var sel = ui.$("#p-inst-f-lv", S.els.body);
    if (!sel) return;
    if (S.ldPick === "vanilla") { sel.innerHTML = '<option value="">—</option>'; return; }
    sel.innerHTML = '<option value="">Загрузка…</option>';
    try {
      var all = (await api("versions.loaders", { mcVersion: S.mcPick })) || [];
      if (S.dead) return;
      var list = all.filter(function (x) { return String(x.loader || "").toLowerCase() === S.ldPick; });
      if (!list.length) { sel.innerHTML = '<option value="">Нет версий</option>'; S.lvPick = ""; return; }
      if (!list.some(function (x) { return x.version === S.lvPick; })) {
        S.lvPick = (list.find(function (x) { return x.stable; }) || list[0]).version;
      }
      sel.innerHTML = list.map(function (x) { return option(x.version, x.version + (x.stable ? "" : " (beta)"), S.lvPick); }).join("");
    } catch (e) {
      sel.innerHTML = '<option value="">Ошибка загрузки</option>';
      ui.notifyError(e, "Не удалось загрузить версии загрузчика");
    }
  }

  async function loadJavaHint() {
    var box = ui.$("#p-inst-jhint", S.els.body);
    if (!box) return;
    box.innerHTML = '<div class="p-inst-note">Проверка Java…</div>';
    try {
      var r = await api("java.recommend", { instanceId: S.id });
      if (S.dead || !box.isConnected) return;
      var found = r ? (typeof r.found === "boolean" ? r.found : !!(r.path || r.major)) : false;
      var need = (r && (r.required || r.major)) || 21;
      if (found) {
        box.innerHTML = '<div class="p-inst-note">' + ic("check") + " Рекомендуется Java " + ui.fmtNum(r.major) +
          (r.reason ? " — " + esc(r.reason) : "") + (r.path ? " · " + esc(r.path) : "") + "</div>";
      } else {
        box.innerHTML = '<div class="banner warn">' + ic("alert") +
          '<span class="grow">Подходящая Java не найдена' + (r && r.reason ? ": " + esc(r.reason) : "") + "</span>" +
          '<button class="btn btn-sm btn-primary" data-act="jinst">Установить Java ' + ui.fmtNum(need) + "</button></div>";
        var b = box.querySelector('[data-act="jinst"]');
        if (b) b.onclick = function () { javaInstallDialog(need); };
      }
    } catch (e) {
      if (!box.isConnected) return;
      box.innerHTML = '<div class="p-inst-note">' + esc(ui.errText(e)) + "</div>";
    }
  }

  function javaInstallDialog(preset) {
    var majors = [8, 11, 17, 21, 25];
    if (majors.indexOf(preset) < 0) preset = 21;
    var bodyEl = document.createElement("div");
    bodyEl.className = "col";
    bodyEl.innerHTML = '<div class="field"><label>Версия Java</label>' +
      '<div class="row wrap" style="gap:7px" id="ji-list">' +
      majors.map(function (m) {
        return '<button class="chip' + (m === preset ? " active" : "") + '" data-m="' + m + '">Java ' + m + "</button>";
      }).join( "") + "</div></div>" +
      '<div class="p-inst-note">Лаунчер скачает Temurin и настроит сборку автоматически.</div>';
    var chosen = preset;
    ui.openDialog({
      title: "Установка Java",
      icon: "coffee",
      body: bodyEl,
      buttons: [
        { label: "Отмена", role: "cancel" },
        {
          label: "Установить", role: "primary", keepOpen: true,
          onClick: async function (ctx) {
            try {
              await api("java.install", { major: chosen });
              ui.notifySuccess("Java установлена", "Java " + chosen);
              ctx.close();
              loadJavaHint();
              return false;
            } catch (e) { ui.notifyError(e, "Не удалось установить Java"); return false; }
          },
        },
      ],
    });
    Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-m]"), function (b) {
      b.onclick = function () {
        chosen = parseInt(b.dataset.m, 10);
        Array.prototype.forEach.call(bodyEl.querySelectorAll("[data-m]"), function (x) {
          x.classList.toggle("active", x === b);
        });
      };
    });
  }

  async function fillAccounts() {
    var sel = ui.$("#p-inst-f-acc", S.els.body);
    if (!sel) return;
    try {
      var list = (await api("accounts.list")) || [];
      if (S.dead || !sel.isConnected) return;
      sel.innerHTML = '<option value="">По умолчанию</option>' + list.map(function (a) {
        return option(a.uuid, a.name + (a.default ? " · основной" : ""), S.inst.accountUuid || "");
      }).join("");
      sel.value = S.inst.accountUuid || "";
    } catch (e) {
      sel.innerHTML = '<option value="">Не удалось загрузить аккаунты</option>';
    }
  }

  function bindSettings() {
    var b = S.els.body;
    function el(sel) { return ui.$(sel, b); }

    var f;
    if ((f = el("#p-inst-f-name"))) f.oninput = function () { queueSave({ name: this.value }); };
    if ((f = el("#p-inst-f-desc"))) f.oninput = function () { queueSave({ description: this.value }); };
    if ((f = el("#p-inst-f-color"))) f.oninput = function () { queueSave({ color: this.value }); };
    if ((f = el("#p-inst-f-fav"))) f.onchange = function () { queueSave({ favorite: this.checked }); };

    var iconBtnEl = b.querySelector('[data-act="icon"]');
    if (iconBtnEl) iconBtnEl.onclick = async function () {
      try {
        var files = await api("system.pickFiles", { title: "Иконка сборки", filter: "image" });
        if (!files || !files.length) return;
        var inst = await saveNow({ iconPath: files[0] });
        if (inst) renderHero();
      } catch (e) { ui.notifyError(e, "Не удалось выбрать изображение"); }
    };
    var iconClr = b.querySelector('[data-act="icon-clear"]');
    if (iconClr) iconClr.onclick = async function () {
      var inst = await saveNow({ iconPath: "" });
      if (inst) renderHero();
    };

    var verBtn = b.querySelector('[data-act="ver"]');
    if (verBtn) verBtn.onclick = function () { changeVersionDialog(); };

    var mcq = el("#p-inst-f-mcq");
    if (mcq) mcq.oninput = ui.debounce(function () { fillMcVersions(mcq.value); }, 200);
    var mc = el("#p-inst-f-mc");
    if (mc) mc.onchange = function () { S.mcPick = this.value; loadLoaderVersions(); };
    var ld = el("#p-inst-f-ld");
    if (ld) ld.onchange = function () { S.ldPick = this.value; S.lvPick = ""; loadLoaderVersions(); };
    var lv = el("#p-inst-f-lv");
    if (lv) lv.onchange = function () { S.lvPick = this.value; };

    var jm = el("#p-inst-f-jm");
    if (jm) jm.onchange = async function () {
      var mode = this.value;
      applyJavaVisibility(mode);
      try {
        var params = { instanceId: S.id, mode: mode };
        if (mode === "major") params.value = parseInt((el("#p-inst-f-jma") || {}).value, 10) || 21;
        if (mode === "path") params.value = (el("#p-inst-f-jp") || {}).value;
        await api("java.setInstance", params);
        ui.notifySuccess("Сохранено");
        loadJavaHint();
      } catch (e) { ui.notifyError(e, "Не удалось изменить режим Java"); }
    };
    var jma = el("#p-inst-f-jma");
    if (jma) jma.onchange = async function () {
      if (!jm || jm.value !== "major") return;
      try { await api("java.setInstance", { instanceId: S.id, mode: "major", value: parseInt(this.value, 10) }); ui.notifySuccess("Сохранено"); }
      catch (e) { ui.notifyError(e); }
    };
    var jp = el("#p-inst-f-jp");
    if (jp) jp.oninput = ui.debounce(async function () {
      if (!jm || jm.value !== "path") return;
      try { await api("java.setInstance", { instanceId: S.id, mode: "path", value: this.value }); ui.notifySuccess("Сохранено"); }
      catch (e) { ui.notifyError(e); }
    }, 600);

    if ((f = el("#p-inst-f-rmin"))) f.onchange = function () { queueSave({ ramMinMb: parseInt(this.value, 10) || 512 }); };
    if ((f = el("#p-inst-f-rmax"))) f.onchange = function () {
      var v = parseInt(this.value, 10) || 4096;
      var c = el("#p-inst-f-rcustom");
      if (c) c.value = v;
      queueSave({ ramMaxMb: v });
      updateRamWarn();
    };
    if ((f = el("#p-inst-f-rcustom"))) f.oninput = ui.debounce(function () {
      var v = parseInt(this.value, 10);
      if (!v || v < 512) return;
      queueSave({ ramMaxMb: v });
      var s = el("#p-inst-f-rmax");
      if (s && Array.prototype.some.call(s.options, function (o) { return parseInt(o.value, 10) === v; })) s.value = v;
      updateRamWarn();
    }, 500);

    Array.prototype.forEach.call(b.querySelectorAll("#p-inst-f-wm [data-wm]"), function (btn) {
      btn.onclick = function () {
        Array.prototype.forEach.call(b.querySelectorAll("#p-inst-f-wm [data-wm]"), function (x) {
          x.classList.toggle("active", x === btn);
        });
        queueSave({ windowMode: btn.dataset.wm });
      };
    });
    if ((f = el("#p-inst-f-width"))) f.oninput = ui.debounce(function () { queueSave({ width: parseInt(this.value, 10) || 1920 }); }, 500);
    if ((f = el("#p-inst-f-height"))) f.oninput = ui.debounce(function () { queueSave({ height: parseInt(this.value, 10) || 1080 }); }, 500);
    if ((f = el("#p-inst-f-vsync"))) f.onchange = function () { queueSave({ vsync: this.checked }); };
    if ((f = el("#p-inst-f-fps"))) f.oninput = ui.debounce(function () { queueSave({ fpsLimit: parseInt(this.value, 10) || 0 }); }, 500);

    if ((f = el("#p-inst-f-jvm"))) f.oninput = ui.debounce(function () { queueSave({ jvmArgs: this.value }); }, 600);
    if ((f = el("#p-inst-f-game"))) f.oninput = ui.debounce(function () { queueSave({ gameArgs: this.value }); }, 600);
    if ((f = el("#p-inst-f-env"))) f.oninput = ui.debounce(function () { queueSave({ envVars: this.value }); }, 600);

    var expert = el("#p-inst-f-expert");
    if (expert) expert.onchange = async function () {
      var on = this.checked;
      try {
        await api("settings.set", { expertMode: on });
        App.settings.expertMode = on;
        ui.notifySuccess(on ? "Экспертный режим включён" : "Экспертный режим выключен");
        renderSettings();
      } catch (e) { ui.notifyError(e, "Не удалось изменить настройку"); }
    };

    if ((f = el("#p-inst-f-acc"))) f.onchange = function () { queueSave({ accountUuid: this.value || "" }); };
    if ((f = el("#p-inst-f-safe"))) f.onchange = function () { queueSave({ safeMode: this.checked }); };
    if ((f = el("#p-inst-f-sip"))) f.oninput = ui.debounce(function () { queueSave({ serverIp: this.value.trim() }); }, 500);
    if ((f = el("#p-inst-f-sport"))) f.onchange = function () { queueSave({ serverPort: parseInt(this.value, 10) || 25565 }); };
  }

  /* ================= вкладка «Доступ» ================= */
  function renderAccess() {
    S.els.body.innerHTML =
      '<div class="p-inst-actions">' +
        '<div class="p-inst-card"><h3>Экспортировать…</h3>' +
          '<p class="p-inst-note">Соберёт выбранные компоненты в архив .zip для переноса.</p>' +
          '<div><button class="btn btn-primary" data-act="exp">' + ic("upload") + " Экспорт…</button></div></div>" +
        '<div class="p-inst-card"><h3>Импортировать…</h3>' +
          '<p class="p-inst-note">Добавит архив сборки (.nlpkg / .zip) как новую сборку.</p>' +
          '<div><button class="btn" data-act="imp">' + ic("download") + " Импорт…</button></div></div>" +
        '<div class="p-inst-card"><h3>Поделиться файлом сборки</h3>' +
          '<p class="p-inst-note">Создаст архив и откроет его в Проводнике, чтобы вы могли отправить его друзьям.</p>' +
          '<div><button class="btn" data-act="share">' + ic("external") + " Создать архив…</button></div></div>" +
      "</div>" +
      '<div class="banner info">' + ic("globe") +
        '<span class="grow">Онлайн-синхронизация сборок между устройствами появится позже — сейчас доступна только локальная работа с файлами.</span></div>';

    S.els.body.querySelector('[data-act="exp"]').onclick = function () { exportDialog(false); };
    S.els.body.querySelector('[data-act="share"]').onclick = function () { exportDialog(true); };
    S.els.body.querySelector('[data-act="imp"]').onclick = importInstanceArchive;
  }

  function exportDialog(share) {
    var parts = [
      ["mods", "Моды"], ["resourcepacks", "Ресурс-паки"], ["shaders", "Шейдеры"],
      ["configs", "Конфиги"], ["worlds", "Миры"], ["options", "Настройки игры"], ["screenshots", "Скриншоты"],
    ];
    var bodyEl = document.createElement("div");
    bodyEl.className = "col";
    bodyEl.innerHTML = parts.map(function (p) {
      return '<label class="p-inst-check"><input type="checkbox" value="' + p[0] + '" checked /> ' + esc(p[1]) + "</label>";
    }).join("") +
      '<div class="p-inst-note">В архив попадут файлы из .minecraft выбранной сборки.</div>';

    ui.openDialog({
      title: share ? "Поделиться файлом сборки" : "Экспорт сборки",
      sub: share ? "Создадим архив и откроем его в Проводнике." : "Выберите компоненты и папку назначения.",
      icon: "upload",
      body: bodyEl,
      buttons: [
        { label: "Отмена", role: "cancel" },
        {
          label: share ? "Создать архив…" : "Экспорт…",
          role: "primary", keepOpen: true,
          onClick: async function (ctx) {
            var include = {};
            Array.prototype.forEach.call(bodyEl.querySelectorAll("input[type=checkbox]"), function (c) {
              include[c.value] = c.checked;
            });
            if (!Object.keys(include).some(function (k) { return include[k]; })) {
              ui.notifyWarn("Ничего не выбрано", "Отметьте хотя бы один компонент.");
              return false;
            }
            try {
              var dir = await api("system.pickDirectory", { title: "Куда сохранить архив" });
              if (!dir || !dir.path) return false;
              var safe = String(S.inst.name || "instance").replace(/[\\/:*?"<>|]/g, "_");
              var target = String(dir.path).replace(/[\\/]+$/, "") + "\\" + safe + ".zip";
              var res = await api("instances.export", { id: S.id, targetPath: target, include: include });
              if (S.dead) return false;
              if (res && res.cancelled) return false;
              if (share && res && res.path) {
                await api("system.openPath", { path: res.path, select: true });
                ui.notifySuccess("Архив готов", res.path);
              } else {
                ui.notifySuccess("Экспорт завершён", (res && res.path ? res.path + " · " : "") + ui.fmtBytes(res && res.bytes));
              }
              ctx.close();
              return false;
            } catch (e) { ui.notifyError(e, "Не удалось выполнить экспорт"); return false; }
          },
        },
      ],
    });
  }

  async function importInstanceArchive() {
    try {
      var files = await api("system.pickFiles", { title: "Импорт сборки", filter: "instance" });
      if (!files || !files.length) return;
      var created = await api("instances.import", { sourcePath: files[0] });
      if (S.dead) return;
      ui.notifySuccess("Сборка импортирована", created && created.name);
      if (created && created.id) nav("instance", { id: created.id });
      else renderTab();
    } catch (e) { ui.notifyError(e, "Не удалось импортировать сборку"); }
  }

  Pages.register("instance", { title: "Сборка", init: init, dispose: dispose });
})();
</script>
