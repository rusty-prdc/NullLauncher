<style>
/* ===== instances — страница-специфичные стили (префикс ipl-) ===== */
.ipl-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ipl-toolbar select { width: auto; min-width: 170px; }
.ipl-toolbar .segmented button { display: inline-flex; align-items: center; gap: 6px; }
.ipl-toolbar .segmented button svg { width: 14px; height: 14px; }
.ipl-chips { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.ipl-chips .chip.drop-over { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ipl-chips .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.ipl-grid { grid-auto-flow: row; }
.ipl-table td:first-child { width: 44px; }
.ipl-table .row-name { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.ipl-table .row-actions { display: flex; gap: 5px; justify-content: flex-end; }
.ipl-empty { padding: 46px 20px; }
.ipl-empty h3 { font-size: 16px; }
.ipl-skel { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.ipl-skel .skeleton { height: 176px; border-radius: var(--r-md); }
/* мастер создания */
.ipl-wz { display: flex; flex-direction: column; gap: 14px; min-height: 240px; }
.ipl-wz-head { display: flex; align-items: center; gap: 10px; }
.ipl-wz-head .step-name { font-weight: 650; font-size: 14px; }
.ipl-wz-head .step-num { font-size: 11.5px; color: var(--text-3); }
.ipl-wz-err { color: var(--danger); font-size: 12px; }
.ipl-wz-err[hidden] { display: none; }
.ipl-wz .btn[hidden] { display: none; }
.ipl-wz-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
.ipl-opt {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; text-align: left;
  border-bottom: 1px solid var(--line); transition: background var(--t);
}
.ipl-opt:last-child { border-bottom: none; }
.ipl-opt:hover { background: var(--card-2); }
.ipl-opt.sel { background: var(--accent-soft); }
.ipl-opt .grow { flex: 1; min-width: 0; }
.ipl-opt .nm { font-weight: 600; font-size: 13px; }
.ipl-opt .sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.ipl-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ipl-filters .search-box { max-width: none; }
.ipl-check { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.ipl-check input { width: 15px; height: 15px; accent-color: var(--accent); }
.ipl-summary { display: flex; flex-direction: column; gap: 8px; }
.ipl-summary .srow { display: flex; gap: 10px; font-size: 13px; }
.ipl-summary .srow .k { color: var(--text-3); width: 160px; flex: 0 0 auto; }
.ipl-summary .srow .v { font-weight: 600; }
.ipl-ram-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.ipl-drop-hint { font-size: 12px; color: var(--text-3); }
.ipl-color-input { width: 46px; height: 34px; padding: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); }

/* ===== мастер создания: светлый мягкий стиль (эталон-фото) ===== */
.wz-tpls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wz-tpl {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 11px 12px; background: var(--card-2); border: 1px solid transparent;
  border-radius: var(--r-md); transition: background var(--t), border-color var(--t), box-shadow var(--t);
}
.wz-tpl:hover { background: var(--card-3); }
.wz-tpl.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wz-tpl .ic {
  width: 32px; height: 32px; border-radius: 9px; background: var(--card);
  border: 1px solid var(--line); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden;
}
.wz-tpl .ic img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; }
.wz-tpl .ic svg { width: 16px; height: 16px; color: var(--text-3); }
.wz-tpl .tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wz-tpl .nm { font-size: 13px; font-weight: 620; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wz-tpl .ds {
  font-size: 11.5px; color: var(--text-3); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.wz-idrow { display: flex; gap: 14px; align-items: flex-start; }
.wz-icon {
  width: 64px; height: 64px; flex: 0 0 auto; border-radius: var(--r-md);
  border: 1px dashed var(--line-strong); display: grid; place-items: center; gap: 3px;
  background-image: repeating-linear-gradient(135deg, var(--card-2) 0 8px, var(--card-3) 8px 16px);
  color: var(--text-3); font-size: 10px; transition: border-color var(--t), color var(--t);
}
.wz-icon:hover { border-color: var(--accent); color: var(--accent); }
.wz-icon svg { width: 18px; height: 18px; }
.wz-loaders { display: flex; flex-wrap: wrap; gap: 8px; }
.wz-loaders .chip {
  height: 38px; padding: 0 15px; gap: 8px; font-size: 13.5px; font-weight: 550;
  border-radius: 999px; background: var(--card-2); color: var(--text-2);
  transition: background var(--t), border-color var(--t), color var(--t), box-shadow var(--t);
}
.wz-loaders .chip img { width: 20px; height: 20px; border-radius: 5px; }
.wz-loaders .chip:hover { background: var(--card-3); color: var(--text); }
.wz-loaders .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wz-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wz-row .t { font-size: 13.5px; font-weight: 620; color: var(--text); }
.wz-row .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.wz-mods { display: flex; gap: 6px; flex-wrap: wrap; }
.wz-status { min-height: 16px; color: var(--accent); font-weight: 550; font-size: 12.5px; }
.wz-status:empty { display: none; }
/* крупные мягкие контролы внутри диалога мастера */
.wz-dialog .dialog-foot .btn { height: 42px; padding: 0 24px; font-size: 14px; border-radius: 999px; }
.wz-dialog .dialog-foot .btn-primary { min-width: 210px; font-weight: 620; }
.wz-dialog .dialog-body { gap: 15px; }
.wz-dialog input[type="text"], .wz-dialog input[type="search"] {
  height: 42px; border-radius: 12px; font-size: 14px; padding: 0 14px;
}
.wz-dialog .search-box input { padding-left: 40px; }
.wz-dialog textarea { border-radius: 12px; padding: 10px 14px; }
.wz-dialog .ipl-wz-list { border-radius: var(--r-md); }
.wz-dialog .ipl-opt { padding: 9px 12px; }
.wz-dialog .ipl-opt.sel { box-shadow: inset 2px 0 0 var(--accent); }
</style>

<section class="page">
  <div class="page-head">
    <div class="grow">
      <h1 class="page-title">Мои сборки</h1>
      <div class="page-sub" id="ipl-count">Загрузка…</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="ipl-create"><svg><use href="#i-plus"/></svg> Создать сборку</button>
      <button class="btn" id="ipl-import"><svg><use href="#i-upload"/></svg> Импортировать</button>
    </div>
  </div>

  <div class="ipl-toolbar">
    <div class="search-box">
      <svg><use href="#i-search"/></svg>
      <input type="search" id="ipl-q" placeholder="Поиск по названию, версии, загрузчику…" autocomplete="off" />
    </div>
    <div class="segmented" id="ipl-view" role="group" aria-label="Вид">
      <button data-view="grid" class="active"><svg><use href="#i-grid"/></svg> Сетка</button>
      <button data-view="list"><svg><use href="#i-list"/></svg> Список</button>
    </div>
    <select id="ipl-sort" title="Сортировка">
      <option value="name">Название</option>
      <option value="lastPlayed">Последний запуск</option>
      <option value="created">Дата создания</option>
      <option value="version">Версия Minecraft</option>
      <option value="mods">Кол-во модов</option>
    </select>
  </div>

  <div class="ipl-chips" id="ipl-groups"></div>

  <div id="ipl-body"></div>
</section>

<script>
(function () {
  if (!Pages.register) Pages.register = function (route, def) { Pages[route] = def; };

  var LOADER_LABELS = { vanilla: "Vanilla", fabric: "Fabric", forge: "Forge", neoforge: "NeoForge", quilt: "Quilt" };
  var RAM_PRESETS = [1024, 2048, 4096, 6144, 8192, 12288, 16384];

  /* логотипы загрузчиков — настоящие файлы в UI/assets/logos */
  var LOADER_LOGOS = {
    vanilla: "assets/logos/mojang.png",
    fabric: "assets/logos/fabric.png",
    forge: "assets/logos/forge.jpg",
    neoforge: "assets/logos/neoforge.png",
    quilt: "assets/logos/quilt.png",
  };

  /* Шаблоны мастера: реальные загрузчики; mods — реальные slug'и проектов Modrinth,
     которые реально установятся после создания (совместимость проверяется по версии и загрузчику). */
  var TEMPLATES = [
    { id: "vanilla", t: "Чистая", s: "Без модов, оригинальная игра", loader: "vanilla", mods: [], logo: LOADER_LOGOS.vanilla },
    { id: "boost", t: "Fabric + Буст FPS", s: "Sodium, Lithium, FerriteCore", loader: "fabric",
      mods: [{ slug: "sodium", name: "Sodium" }, { slug: "lithium", name: "Lithium" }, { slug: "ferritecore", name: "FerriteCore" }],
      logo: LOADER_LOGOS.fabric },
    { id: "shaders", t: "Шейдеры", s: "Sodium + Iris Shaders", loader: "fabric",
      mods: [{ slug: "sodium", name: "Sodium" }, { slug: "iris", name: "Iris" }],
      logo: LOADER_LOGOS.fabric },
    { id: "forge", t: "Forge", s: "Классика для большинства модов", loader: "forge", mods: [], logo: LOADER_LOGOS.forge },
    { id: "neoforge", t: "NeoForge", s: "Современная ветка Forge", loader: "neoforge", mods: [], logo: LOADER_LOGOS.neoforge },
    { id: "quilt", t: "Quilt", s: "Экспериментальный загрузчик", loader: "quilt", mods: [], logo: LOADER_LOGOS.quilt },
  ];
  function presetById(id) { return TEMPLATES.filter(function (t) { return t.id === id; })[0] || TEMPLATES[0]; }

  var S = {
    dead: false, loading: true, error: null,
    list: [], groups: [],
    q: "", view: "grid", sort: "name", group: null,
    running: [], runningLimit: 1, runTimer: null,
    unsubs: [], lastHostDrop: 0,
    els: {},
  };

  /* ---------- утилиты ---------- */
  function errBlock(e, retryLabel) {
    var d = ui.errDetail(e);
    return '<div class="state error">' + ui.icon("alert") +
      "<h3>Не удалось выполнить действие</h3><p>" + ui.esc(ui.errText(e)) + "</p>" +
      (d ? '<details class="ipl-details"><summary style="cursor:pointer;font-size:12px;color:var(--text-3)">Подробнее</summary><pre class="mono dim" style="white-space:pre-wrap;text-align:left">' + ui.esc(d) + "</pre></details>" : "") +
      "</div>";
  }
  function instLetter(inst) { return ui.esc((inst.name || "?").trim().charAt(0).toUpperCase() || "?"); }
  function instColor(inst) { return inst.color || "#3ecf8e"; }

  function filtered() {
    var q = S.q.trim().toLowerCase();
    var out = S.list.filter(function (i) {
      if (S.group && !(i.groupIds || []).includes(S.group)) return false;
      if (!q) return true;
      return (i.name || "").toLowerCase().includes(q) ||
        (i.mcVersion || "").toLowerCase().includes(q) ||
        (i.loader || "").toLowerCase().includes(q) ||
        (i.description || "").toLowerCase().includes(q);
    });
    var s = S.sort;
    out.sort(function (a, b) {
      if (s === "lastPlayed") return new Date(b.lastPlayedAt || 0) - new Date(a.lastPlayedAt || 0);
      if (s === "created") return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      if (s === "version") return String(b.mcVersion).localeCompare(String(a.mcVersion), undefined, { numeric: true });
      if (s === "mods") return (b.modCount || 0) - (a.modCount || 0);
      return String(a.name).localeCompare(String(b.name), "ru");
    });
    return out;
  }

  /* ---------- состояние запуска ---------- */
  function runningOf(id) { return S.running.filter(function (x) { return x.instanceId === id; })[0] || null; }
  function otherRunning(id) { return S.running.filter(function (x) { return x.instanceId !== id; })[0] || null; }

  async function refreshRunning() {
    try {
      var r = await api("launch.running");
      if (S.dead) return;
      S.running = (r && r.items) || [];
      S.runningLimit = (r && r.limit) || 1;
      renderBody();
    } catch (e) { /* noop */ }
  }

  function runChip(id) {
    var run = runningOf(id);
    if (!run) return "";
    return '<span class="chip ok">' + (run.preparing ? "запускается…" : "запущено") + "</span>";
  }

  function playTitle(id) {
    var run = runningOf(id);
    if (run) return run.preparing ? "Идёт подготовка запуска" : "Сборка уже запущена";
    var other = otherRunning(id);
    return other ? ("Уже запущена «" + other.name + "»") : "Играть";
  }

  function playDisabled(id) { return !!(runningOf(id) || otherRunning(id)); }

  /* ---------- карточка / строка ---------- */
  function cardHTML(inst) {
    return '<div class="inst-card" draggable="true" data-id="' + ui.esc(inst.id) + '">' +
      '<div class="cover"><div class="item-icon" style="background:' + ui.esc(instColor(inst)) + ';color:#08130d">' + instLetter(inst) + "</div></div>" +
      "<h4>" + ui.esc(inst.name) + (inst.favorite ? ui.icon("star", "fav") : "") + "</h4>" +
      '<div class="meta">' +
        '<span class="chip">Minecraft ' + ui.esc(inst.mcVersion) + "</span>" +
        '<span class="chip">' + ui.esc(LOADER_LABELS[inst.loader] || inst.loader || "vanilla") + "</span>" +
        (inst.modCount ? '<span class="chip">' + ui.fmtNum(inst.modCount) + " модов</span>" : "") +
        runChip(inst.id) +
      "</div>" +
      '<div class="foot"><span class="last">Последний запуск ' + ui.esc(ui.fmtRelative(inst.lastPlayedAt)) + "</span>" +
        '<button class="btn btn-sm play" data-act="play" title="' + ui.esc(playTitle(inst.id)) + '"' +
          (playDisabled(inst.id) ? " disabled" : "") + ">" + ui.icon("play") + "</button>" +
        '<button class="btn btn-icon btn-sm btn-ghost" data-act="more" title="Ещё">' + ui.icon("more") + "</button>" +
      "</div>" +
      "</div>";
  }

  function rowHTML(inst) {
    return '<tr data-id="' + ui.esc(inst.id) + '" draggable="true">' +
      '<td><div class="item-icon sm" style="background:' + ui.esc(instColor(inst)) + ';color:#08130d">' + instLetter(inst) + "</div></td>" +
      '<td><div class="row-name">' + ui.esc(inst.name) + (inst.favorite ? ui.icon("star", "fav") : "") + " " + runChip(inst.id) + "</div>" +
        (inst.description ? '<div class="small dim truncate" style="max-width:340px">' + ui.esc(inst.description) + "</div>" : "") + "</td>" +
      "<td>" + ui.esc(inst.mcVersion) + "</td>" +
      "<td>" + ui.esc(LOADER_LABELS[inst.loader] || inst.loader || "vanilla") + (inst.loaderVersion ? " " + ui.esc(inst.loaderVersion) : "") + "</td>" +
      '<td class="num">' + ui.fmtNum(inst.modCount || 0) + "</td>" +
      '<td class="dim small nowrap">' + ui.esc(ui.fmtRelative(inst.lastPlayedAt)) + "</td>" +
      '<td><div class="row-actions">' +
        '<button class="btn btn-sm play" data-act="play" title="' + ui.esc(playTitle(inst.id)) + '"' +
          (playDisabled(inst.id) ? " disabled" : "") + ">" + ui.icon("play") + "</button>" +
        '<button class="btn btn-icon btn-sm btn-ghost" data-act="more" title="Ещё">' + ui.icon("more") + "</button>" +
      "</div></td></tr>";
  }

  /* ---------- отрисовка ---------- */
  function renderCount() {
    var el = S.els.count;
    if (!el) return;
    if (S.loading) { el.textContent = "Загрузка…"; return; }
    if (S.error) { el.textContent = "Не удалось загрузить сборки"; return; }
    var n = S.list.length;
    el.textContent = n + " " + (n % 10 === 1 && n % 100 !== 11 ? "сборка" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "сборки" : "сборок");
  }

  function renderGroups() {
    var box = S.els.groups;
    if (!box) return;
    var html = '<button class="chip' + (S.group === null ? " active" : "") + '" data-g="">Все · ' + S.list.length + "</button>";
    S.groups.forEach(function (g) {
      var n = (g.instanceIds || []).length;
      html += '<button class="chip' + (S.group === g.id ? " active" : "") + '" data-g="' + ui.esc(g.id) + '">' +
        '<span class="dot" style="background:' + ui.esc(g.color || "#3ecf8e") + '"></span>' + ui.esc(g.name) + " · " + n + "</button>";
    });
    html += '<button class="chip" data-act="new-group">' + ui.icon("plus") + " Группа</button>";
    box.innerHTML = html;

    box.querySelectorAll("[data-g]").forEach(function (chip) {
      chip.onclick = function () {
        S.group = chip.dataset.g === "" ? null : chip.dataset.g;
        renderGroups(); renderBody();
      };
      if (chip.dataset.g) {
        var g = S.groups.find(function (x) { return x.id === chip.dataset.g; });
        ui.bindContextMenu(chip, function () { return groupMenu(g); });
        chip.addEventListener("dragover", function (e) { e.preventDefault(); chip.classList.add("drop-over"); });
        chip.addEventListener("dragleave", function () { chip.classList.remove("drop-over"); });
        chip.addEventListener("drop", function (e) {
          e.preventDefault();
          chip.classList.remove("drop-over");
          var id = e.dataTransfer && e.dataTransfer.getData("text/plain");
          if (!id) return;
          api("groups.addInstance", { groupId: g.id, instanceId: id }).then(function () {
            ui.notifySuccess("Добавлено в группу", g.name);
            reload();
          }, function (err) { ui.notifyError(err, "Не удалось добавить в группу"); });
        });
      }
    });
    box.querySelector('[data-act="new-group"]').onclick = createGroup;
  }

  function groupMenu(g) {
    return [
      { label: g.name, header: true },
      {
        label: "Переименовать", icon: "edit",
        onClick: async function () {
          var name = await ui.promptDialog({ title: "Переименовать группу", value: g.name, okLabel: "Сохранить" });
          if (!name) return;
          try { await api("groups.update", { id: g.id, name: name }); ui.notifySuccess("Группа переименована"); reload(); }
          catch (e) { ui.notifyError(e); }
        }
      },
      {
        label: "Цвет", icon: "image",
        onClick: async function () {
          var color = await ui.promptDialog({
            title: "Цвет группы", value: g.color || "#3ecf8e", okLabel: "Применить",
            validate: function (v) { return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v) ? "" : "Укажите цвет в формате #RRGGBB"; },
          });
          if (!color) return;
          try { await api("groups.update", { id: g.id, color: color }); ui.notifySuccess("Цвет обновлён"); reload(); }
          catch (e) { ui.notifyError(e); }
        }
      },
      "-",
      {
        label: "Удалить", icon: "trash", danger: true,
        onClick: async function () {
          var ok = await ui.confirmDialog({ title: "Удалить группу?", message: "Сборки останутся — исчезнет только группа.", danger: true, okLabel: "Удалить" });
          if (!ok) return;
          try { await api("groups.delete", { id: g.id }); ui.notifySuccess("Группа удалена"); reload(); }
          catch (e) { ui.notifyError(e); }
        }
      },
    ];
  }

  async function createGroup() {
    var name = await ui.promptDialog({ title: "Новая группа", placeholder: "Например, Техно", okLabel: "Создать" });
    if (!name) return;
    try { await api("groups.create", { name: name }); ui.notifySuccess("Группа создана", name); reload(); }
    catch (e) { ui.notifyError(e, "Не удалось создать группу"); }
  }

  function renderBody() {
    var box = S.els.body;
    if (!box) return;
    renderCount();

    if (S.loading) {
      box.innerHTML = '<div class="ipl-skel"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
      return;
    }
    if (S.error) { box.innerHTML = errBlock(S.error); return; }

    if (!S.list.length) {
      box.innerHTML = '<div class="state ipl-empty">' + ui.icon("package") +
        "<h3>У вас пока нет сборок</h3><p>Создайте сборку в несколько шагов или импортируйте готовый архив .zip.</p>" +
        '<div class="actions">' +
        '<button class="btn btn-primary" data-act="create">' + ui.icon("plus") + " Создать сборку</button>" +
        '<button class="btn" data-act="import">' + ui.icon("upload") + " Импортировать</button>" +
        "</div></div>";
      box.querySelector('[data-act="create"]').onclick = function () { openWizard(); };
      box.querySelector('[data-act="import"]').onclick = importArchive;
      return;
    }

    var items = filtered();
    if (!items.length) {
      box.innerHTML = '<div class="state">' + ui.icon("search") +
        "<h3>Ничего не найдено</h3><p>По текущему запросу или фильтру групп сборок нет.</p>" +
        '<div class="actions"><button class="btn" data-act="reset">Сбросить фильтры</button></div></div>';
      box.querySelector('[data-act="reset"]').onclick = function () {
        S.q = ""; S.group = null;
        S.els.q.value = "";
        renderGroups(); renderBody();
      };
      return;
    }

    if (S.view === "list") {
      var html = '<div class="table-wrap"><table class="table ipl-table"><thead><tr>' +
        "<th>Иконка</th><th>Название</th><th>Версия</th><th>Loader</th><th class=\"num\">Моды</th><th>Последний запуск</th><th></th>" +
        "</tr></thead><tbody>";
      items.forEach(function (i) { html += rowHTML(i); });
      html += "</tbody></table></div>";
      box.innerHTML = html;
      box.querySelectorAll("tbody tr").forEach(function (tr) {
        bindCard(tr, tr.dataset.id);
      });
    } else {
      box.innerHTML = '<div class="grid grid-cards ipl-grid"></div>';
      var grid = box.querySelector(".grid");
      items.forEach(function (i) {
        var div = document.createElement("div");
        div.innerHTML = cardHTML(i);
        var el = div.firstElementChild;
        grid.appendChild(el);
        bindCard(el, i.id);
        ui.applyCover(el.querySelector(".cover"), i.id);
      });
    }
  }

  function bindCard(el, id) {
    var inst = S.list.find(function (i) { return i.id === id; });
    if (!inst) return;

    el.addEventListener("click", function (e) {
      if (e.target.closest("[data-act]")) return;
      navigate("instance", { id: id });
    });

    var playBtn = el.querySelector('[data-act="play"]');
    if (playBtn) playBtn.onclick = function (e) {
      e.stopPropagation();
      var other = otherRunning(id);
      if (other) { ui.notifyWarn("Уже запущена другая сборка", "«" + other.name + "» — сначала остановите её."); return; }
      if (runningOf(id)) { ui.notifyInfo("Сборка уже запущена", inst.name); return; }
      playBtn.classList.add("loading");
      api("launch.start", { instanceId: id }).then(function () {
        playBtn.classList.remove("loading");
        ui.notifyInfo("Запуск", inst.name);
      }, function (err) { playBtn.classList.remove("loading"); ui.notifyError(err, "Не удалось запустить"); })
        .then(function () { refreshRunning(); });
    };

    var moreBtn = el.querySelector('[data-act="more"]');
    if (moreBtn) moreBtn.onclick = function (e) {
      e.stopPropagation();
      var r = moreBtn.getBoundingClientRect();
      ui.contextMenu(r.left, r.bottom + 6, instanceMenu(inst));
    };

    ui.bindContextMenu(el, function () { return instanceMenu(inst); });

    el.addEventListener("dragstart", function (e) {
      el.classList.add("dragging");
      if (e.dataTransfer) { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "copy"; }
    });
    el.addEventListener("dragend", function () { el.classList.remove("dragging"); });
  }

  /* ---------- действия над сборкой ---------- */
  function playInstance(inst) {
    api("launch.start", { instanceId: inst.id }).then(function () {
      ui.notifySuccess("Запуск", inst.name);
    }, function (e) { ui.notifyError(e, "Не удалось запустить"); });
  }

      {
        label: "Удалить", icon: "trash", danger: true,

            danger: true, okLabel: "Удалить",

  /* ---------- импорт / drag&drop ---------- */
  async function importArchive() {
    try {
      var files = await api("system.pickFiles", { title: "Импорт сборки или модпака", filter: "zip" });
      if (!files || !files.length) return;
      var ok = 0, fail = 0;
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        try {
          if (/\.mrpack$/i.test(f)) await api("instances.importMrpack", { sourcePath: f });
          else await api("instances.import", { sourcePath: f });
          ok++;
        } catch (e) { fail++; ui.notifyError(e, "Не удалось импортировать " + f.split(/[\\/]/).pop()); }
      }
      if (ok) ui.notifySuccess("Импорт завершён", "Успешно: " + ok + (fail ? ", ошибок: " + fail : ""));
      reload();
    } catch (e) { ui.notifyError(e, "Не удалось выбрать файл"); }
  }

  function looksLikePath(p) { return /[\\/]/.test(p) || /^[a-zA-Z]:/.test(p); }

  async function importDropped(paths) {
    var ok = 0;
    for (var i = 0; i < paths.length; i++) {
      var p = paths[i];
      var name = p.split(/[\\/]/).pop();
      try {
        if (/\.mrpack$/i.test(name)) { await api("instances.importMrpack", { sourcePath: p }); ok++; }
        else if (/\.zip$/i.test(name)) { await api("instances.import", { sourcePath: p }); ok++; }
        else ui.notifyWarn("Файл пропущен", name + " — этот формат импортируется внутри сборки.");
      } catch (e) { ui.notifyError(e, "Не удалось импортировать " + name); }
    }
    if (ok) { ui.notifySuccess("Импортировано", "Сборок добавлено: " + ok); reload(); }
  }

  function handleDropped(files) {
    if (!files || !files.length) return;
    S.lastHostDrop = Date.now();
    var full = files.filter(looksLikePath);
    if (full.length === files.length) { importDropped(full); return; }
    ui.notifyWarn("Не удалось определить путь файла",
      "Перетащённые файлы пришли без полного пути. Используйте кнопку «Импортировать».");
  }

  /* ---------- мастер создания ---------- */
  function openWizard(preVersion) {
    var w = {
      step: 1, name: "", description: "", color: "#3ecf8e", iconPath: null,
      preset: "vanilla",
      mcVersion: preVersion || "", type: "release", experimental: false, vq: "",
      versions: [], versionsLoading: false, versionsLoaded: false,
      loader: "vanilla", loaderVersion: "", loaders: [], loadersLoading: false,
      javaMode: "auto", javaMajor: 0, javaList: [], javaLoaded: false,
      ramMax: 4096, ramMin: 512,
      creating: false,
    };

    var body = document.createElement("div");
    body.className = "ipl-wz";

    var dlg = ui.openDialog({
      title: "Новая сборка",
      sub: "У каждой сборки своя папка — моды, миры и настройки не смешиваются с другими",
      icon: "plus",
      width: "wide",
      body: body,
      buttons: [
        { id: "back", label: "Назад", left: true, keepOpen: true, onClick: function () { if (w.step > 1) { w.step--; renderStep(); chrome(); } return false; } },
        { id: "next", label: "Далее", role: "primary", keepOpen: true, onClick: nextStep },
      ],
    });
    dlg.el.classList.add("wz-dialog");

    /* имя-автоматика, как в эталоне: «Пусто — назовём сами: 26.3 Vanilla» */
    function autoName() {
      return ((w.mcVersion || "Minecraft") + " " + (LOADER_LABELS[w.loader] || "Vanilla")).trim();
    }

    /* последняя стабильная версия — реальные данные манифеста Mojang */
    if (!w.mcVersion) {
      api("versions.list", { type: "release", limit: 1 }).then(function (list) {
        if (!list || !list.length || w.mcVersion) return;
        w.mcVersion = list[0].id;
        if (w.step === 1) {
          var hint = body.querySelector("#wz-name-hint");
          var inp = body.querySelector("#wz-name");
          if (!w.name.trim() && hint) hint.textContent = "Пусто — назовём сами: " + autoName();
          if (inp) inp.placeholder = autoName();
          var vn = body.querySelector("#wz-tpl-vanilla");
          if (vn) vn.textContent = "Чистая " + w.mcVersion;
        }
      }).catch(function () { /* офлайн — подставим версию на шаге 2 вручную */ });
    }

    function chrome() {
      var back = dlg.foot.querySelector('[data-act="back"]');
      var next = dlg.foot.querySelector('[data-act="next"]');
      back.disabled = w.step === 1 || w.creating;
      next.textContent = w.creating ? "Создание…" : (w.step === 5 ? "Создать сборку" : "Далее");
      next.disabled = w.creating;
    }

    function showError(msg) {
      var el = body.querySelector("#wz-err");
      if (el) { el.textContent = msg || ""; el.hidden = !msg; }
    }

    function stepHead(name) {
      return '<div class="ipl-wz-head"><span class="step-num">Шаг ' + w.step + " из 5</span>" +
        '<span class="step-name">' + ui.esc(name) + "</span></div>" +
        '<div class="wizard-steps">' +
        [1, 2, 3, 4, 5].map(function (n) { return '<span class="st' + (n <= w.step ? " done" : "") + '"><i></i></span>'; }).join("") +
        "</div>" +
        '<div class="ipl-wz-err" id="wz-err" hidden></div>';
    }

    /* --- шаг 1: шаблон + название + иконка --- */
    function step1() {
      body.innerHTML = stepHead("Шаблон и название") +
        '<div class="wz-tpls" id="wz-tpls">' + TEMPLATES.map(function (t) {
          var title = t.id === "vanilla" && w.mcVersion ? t.t + " " + w.mcVersion : t.t;
          return '<button type="button" class="wz-tpl' + (w.preset === t.id ? " sel" : "") + '" data-t="' + t.id + '">' +
            '<span class="ic"><img src="' + t.logo + '" alt="" /></span>' +
            '<span class="tx"><span class="nm"' + (t.id === "vanilla" ? ' id="wz-tpl-vanilla"' : "") + ">" + ui.esc(title) + "</span>" +
            '<span class="ds">' + ui.esc(t.s) + "</span></span></button>";
        }).join("") + "</div>" +
        '<div class="wz-idrow">' +
          '<button type="button" class="wz-icon" id="wz-icon" title="Выбрать изображение">' +
            ui.icon("image") + "<span>Иконка</span></button>" +
          '<div class="field" style="flex:1">' +
            '<label>Название</label>' +
            '<input type="text" id="wz-name" placeholder="' + ui.esc(autoName()) + '" value="' + ui.esc(w.name) + '" />' +
            '<div class="hint" id="wz-name-hint">Пусто — назовём сами: ' + ui.esc(autoName()) + "</div>" +
          "</div>" +
        "</div>" +
        '<div class="row" style="gap:12px;flex-wrap:wrap">' +
          '<div class="field" style="flex:1;min-width:220px"><label>Описание</label><textarea id="wz-desc" rows="2" placeholder="Необязательно">' + ui.esc(w.description) + "</textarea></div>" +
          '<div class="field"><label>Цвет</label><div class="row"><input type="color" class="ipl-color-input" id="wz-color" value="' + ui.esc(w.color) + '" /><span class="dim small mono" id="wz-color-v">' + ui.esc(w.color) + "</span></div></div>" +
        "</div>" +
        '<div class="row" style="gap:8px"><button class="btn btn-sm btn-ghost" id="wz-icon-clear" ' + (w.iconPath ? "" : "hidden") + '>' + ui.icon("x") + " Убрать иконку</button>" +
          '<span class="dim small truncate" id="wz-icon-name">' + (w.iconPath ? ui.esc(w.iconPath.split(/[\\/]/).pop()) : "") + "</span></div>";

      function syncHint() {
        var hint = body.querySelector("#wz-name-hint");
        var inp = body.querySelector("#wz-name");
        if (hint) hint.textContent = w.name.trim() ? "" : "Пусто — назовём сами: " + autoName();
        if (inp) inp.placeholder = autoName();
      }

      body.querySelectorAll("#wz-tpls .wz-tpl").forEach(function (b) {
        b.onclick = function () {
          w.preset = b.dataset.t;
          var t = presetById(w.preset);
          if (w.loader !== t.loader) { w.loader = t.loader; w.loaderVersion = ""; w.loaders = []; }
          body.querySelectorAll("#wz-tpls .wz-tpl").forEach(function (x) { x.classList.toggle("sel", x === b); });
          showError("");
          syncHint();
        };
      });
      body.querySelector("#wz-name").oninput = function () { w.name = this.value; syncHint(); };
      body.querySelector("#wz-desc").oninput = function () { w.description = this.value; };
      body.querySelector("#wz-color").oninput = function () {
        w.color = this.value;
        body.querySelector("#wz-color-v").textContent = this.value;
      };
      body.querySelector("#wz-icon").onclick = async function () {
        try {
          var files = await api("system.pickFiles", { title: "Иконка сборки", filter: "image" });
          if (!files || !files.length) return;
          w.iconPath = files[0];
          body.querySelector("#wz-icon-name").textContent = files[0].split(/[\\/]/).pop();
          body.querySelector("#wz-icon-clear").hidden = false;
        } catch (e) { ui.notifyError(e); }
      };
      body.querySelector("#wz-icon-clear").onclick = function () {
        w.iconPath = null;
        body.querySelector("#wz-icon-name").textContent = "";
        this.hidden = true;
      };
      syncHint();
    }

    /* --- шаг 2 --- */
    function typeSegs() {
      return [
        { t: "", l: "Все" }, { t: "release", l: "Release" }, { t: "old", l: "Старые" },
      ];
    }

    function step2() {
      body.innerHTML = stepHead("Версия Minecraft") +
        '<div class="wz-row">' +
          '<span class="t">Minecraft</span><span class="spacer"></span>' +
          '<label class="wz-row sw"><span>Снапшоты и старые</span>' +
            '<span class="switch"><input type="checkbox" id="wz-exp" ' + (w.experimental ? "checked" : "") + " /><i></i></span></label>" +
        "</div>" +
        '<div class="ipl-filters">' +
          '<div class="segmented" id="wz-segs">' + typeSegs().map(function (s) {
            return '<button data-t="' + s.t + '" class="' + (w.type === s.t ? "active" : "") + '">' + s.l + "</button>";
          }).join("") + "</div>" +
        "</div>" +
        '<div class="search-box" style="max-width:none">' + ui.icon("search") +
          '<input type="search" id="wz-vq" placeholder="Поиск версии…" value="' + ui.esc(w.vq) + '" autocomplete="off" /></div>' +
        '<div class="ipl-wz-list" id="wz-versions"><div class="state"><span class="spinner"></span></div></div>';

      body.querySelectorAll("#wz-segs button").forEach(function (b) {
        b.onclick = function () {
          w.type = b.dataset.t;
          body.querySelectorAll("#wz-segs button").forEach(function (x) { x.classList.toggle("active", x === b); });
          loadVersions();
        };
      });
      body.querySelector("#wz-exp").onchange = function () { w.experimental = this.checked; loadVersions(); };
      var qi = body.querySelector("#wz-vq");
      qi.oninput = ui.debounce(function () { w.vq = qi.value; loadVersions(); }, 260);
      loadVersions();
    }

    async function loadVersions() {
      var box = body.querySelector("#wz-versions");
      if (!box) return;
      box.innerHTML = '<div class="state"><span class="spinner"></span></div>';
      w.versionsLoading = true;
      try {
        var params = { limit: 120 };
        if (w.type) params.type = w.type;
        if (w.vq.trim()) params.query = w.vq.trim();
        var list = (await api("versions.list", params)) || [];
        /* тумблер «Снапшоты и старые»: честно докидываем snapshot/old,
           потому что «все» на бэке дополнительно фильтруется настройками */
        if (w.experimental) {
          var extra = [];
          var wants = w.type ? [] : ["snapshot", "old"];
          for (var i = 0; i < wants.length; i++) {
            var p2 = { limit: 120, type: wants[i] };
            if (w.vq.trim()) p2.query = w.vq.trim();
            try { extra = extra.concat((await api("versions.list", p2)) || []); } catch (e) { /* этот тип не показываем */ }
          }
          list = list.concat(extra);
        } else if (!w.type) {
          list = list.filter(function (v) { return (v.type || "release") === "release"; });
        }
        var seen = {};
        list = list.filter(function (v) { if (!v || seen[v.id]) return false; seen[v.id] = 1; return true; });
        list.sort(function (a, b) { return new Date(b.releaseTime || 0) - new Date(a.releaseTime || 0); });
        w.versions = list;
        w.versionsLoading = false;
        if (!body.querySelector("#wz-versions")) return;
        if (!list.length) {
          box.innerHTML = '<div class="state" style="padding:26px"><p>Версии не найдены. Измените фильтр или запрос.</p></div>';
          return;
        }
        box.innerHTML = list.map(function (v) {
          var sel = v.id === w.mcVersion;
          return '<button class="ipl-opt' + (sel ? " sel" : "") + '" data-v="' + ui.esc(v.id) + '">' +
            '<span class="grow"><span class="nm">' + ui.esc(v.id) + (v.installed ? " " + ui.icon("check") : "") + "</span>" +
            '<span class="sub">' + ui.esc(ui.fmtDate(v.releaseTime)) + " · Java " + ui.esc(String(v.javaMajor || "")) + "</span></span>" +
            '<span class="badge ' + ui.esc(v.type || "release") + '">' + ui.esc(v.type || "release") + "</span></button>";
        }).join("");
        box.querySelectorAll("[data-v]").forEach(function (b) {
          b.onclick = function () {
            w.mcVersion = b.dataset.v;
            w.loaderVersion = "";
            w.loaders = [];
            box.querySelectorAll(".ipl-opt").forEach(function (x) { x.classList.toggle("sel", x === b); });
            showError("");
          };
        });
      } catch (e) {
        w.versionsLoading = false;
        if (body.querySelector("#wz-versions")) body.querySelector("#wz-versions").innerHTML = errBlock(e);
      }
    }

    /* --- шаг 3: загрузчик — чипы с логотипами, как на фото --- */
    function step3() {
      var loaders = ["vanilla", "fabric", "forge", "neoforge", "quilt"];
      body.innerHTML = stepHead("Загрузчик") +
        '<div class="wz-row"><span class="t">Loader</span><span class="spacer"></span>' +
          '<span class="dim small">Minecraft ' + ui.esc(w.mcVersion || "—") + "</span></div>" +
        '<div class="wz-loaders">' + loaders.map(function (l) {
          return '<button class="chip' + (w.loader === l ? " active" : "") + '" data-l="' + l + '">' +
            '<img src="' + LOADER_LOGOS[l] + '" alt="" />' + (LOADER_LABELS[l]) + "</button>";
        }).join("") + "</div>" +
        '<div class="field"><label>Версия загрузчика</label><div id="wz-loaders"></div></div>';
      body.querySelectorAll("[data-l]").forEach(function (b) {
        b.onclick = function () {
          w.loader = b.dataset.l;
          w.loaderVersion = "";
          body.querySelectorAll("[data-l]").forEach(function (x) { x.classList.toggle("active", x === b); });
          loadLoaders();
        };
      });
      loadLoaders();
    }

    async function loadLoaders() {
      var box = body.querySelector("#wz-loaders");
      if (!box) return;
      if (w.loader === "vanilla") { box.innerHTML = '<div class="hint small dim">Vanilla не требует загрузчик — версия будет установлена как есть.</div>'; return; }
      box.innerHTML = '<div class="state" style="padding:26px"><span class="spinner"></span></div>';
      try {
        var all = (await api("versions.loaders", { mcVersion: w.mcVersion })) || [];
        var list = all.filter(function (x) { return String(x.loader || "").toLowerCase() === w.loader; });
        if (!list.length) {
          box.innerHTML = '<div class="state" style="padding:26px"><p>Для ' + ui.esc(w.mcVersion) + " версий " + ui.esc(LOADER_LABELS[w.loader]) + " не найдено.</p></div>";
          w.loaders = [];
          return;
        }
        w.loaders = list;
        if (!w.loaderVersion) {
          var stable = list.find(function (x) { return x.stable; }) || list[0];
          w.loaderVersion = stable.version;
        }
        if (!body.querySelector("#wz-loaders")) return;
        box.innerHTML = '<div class="ipl-wz-list">' + list.map(function (x) {
          var sel = x.version === w.loaderVersion;
          return '<button class="ipl-opt' + (sel ? " sel" : "") + '" data-lv="' + ui.esc(x.version) + '">' +
            '<span class="grow"><span class="nm">' + ui.esc(x.version) + "</span>" +
            '<span class="sub">' + (x.stable ? "стабильная" : "экспериментальная") + "</span></span>" +
            (x.stable ? '<span class="chip on">stable</span>' : '<span class="chip warn">beta</span>') + "</button>";
        }).join("") + "</div>";
        box.querySelectorAll("[data-lv]").forEach(function (b) {
          b.onclick = function () {
            w.loaderVersion = b.dataset.lv;
            box.querySelectorAll(".ipl-opt").forEach(function (x) { x.classList.toggle("sel", x === b); });
          };
        });
      } catch (e) {
        if (body.querySelector("#wz-loaders")) body.querySelector("#wz-loaders").innerHTML = errBlock(e);
      }
    }

    /* --- шаг 4 --- */
    async function step4() {
      body.innerHTML = stepHead("Java и память") +
        '<div class="field"><label>Java</label><div id="wz-java"><span class="spinner" style="display:inline-block"></span></div></div>' +
        '<div class="field"><label>Максимум RAM (МБ)</label>' +
          '<div class="ipl-ram-presets" id="wz-ram">' + RAM_PRESETS.map(function (r) {
            return '<button class="chip' + (w.ramMax === r ? " active" : "") + '" data-r="' + r + '">' + (r >= 1024 ? (r / 1024) + " ГБ" : r + " МБ") + "</button>";
          }).join("") + "</div>" +
          '<div class="row" style="gap:8px;margin-top:8px"><input type="number" id="wz-ram-custom" min="512" step="512" value="' + w.ramMax + '" style="max-width:160px" /><span class="dim small">МБ, свой ввод</span></div>' +
          '<div class="hint">Минимум: <input type="number" id="wz-ram-min" min="128" step="128" value="' + w.ramMin + '" style="max-width:110px;display:inline-block" /> МБ</div>' +
        "</div>" +
        '<div id="wz-ram-warn"></div>';

      function ramUI() {
        body.querySelectorAll("#wz-ram [data-r]").forEach(function (b) {
          b.classList.toggle("active", +b.dataset.r === w.ramMax);
        });
        var total = App.info && App.info.ramTotalMb;
        var warnBox = body.querySelector("#wz-ram-warn");
        if (total && w.ramMax > total) {
          warnBox.innerHTML = '<div class="banner warn">' + ui.icon("alert") +
            '<span class="grow">Указанный объём (' + w.ramMax + " МБ) больше доступной RAM (" + total + " МБ) — Minecraft может не запуститься.</span></div>";
        } else if (total) {
          warnBox.innerHTML = '<div class="hint small dim">Всего RAM в системе: ' + ui.fmtNum(total) + " МБ</div>";
        } else warnBox.innerHTML = "";
      }
      body.querySelectorAll("#wz-ram [data-r]").forEach(function (b) {
        b.onclick = function () { w.ramMax = +b.dataset.r; body.querySelector("#wz-ram-custom").value = w.ramMax; ramUI(); };
      });
      body.querySelector("#wz-ram-custom").oninput = function () { w.ramMax = Math.max(512, parseInt(this.value, 10) || 512); ramUI(); };
      body.querySelector("#wz-ram-min").oninput = function () { w.ramMin = Math.max(128, parseInt(this.value, 10) || 512); };
      ramUI();

      var jbox = body.querySelector("#wz-java");
      try {
        var list = (await api("java.list")) || [];
        w.javaList = list;
        var valid = list.filter(function (j) { return j.valid; });
        if (!w.javaMajor && valid.length) w.javaMajor = valid[0].major;
        if (!body.querySelector("#wz-java")) return;
        if (!valid.length) {
          jbox.innerHTML = '<div class="hint">Совместимая Java не найдена — лаунчер установит её автоматически при первом запуске.</div>';
          w.javaMode = "auto";
          return;
        }
        jbox.innerHTML = '<div class="row wrap" style="gap:10px">' +
          '<label class="ipl-check"><input type="radio" name="wz-java-mode" value="auto" ' + (w.javaMode === "auto" ? "checked" : "") + " /> Авто</label>" +
          '<label class="ipl-check"><input type="radio" name="wz-java-mode" value="major" ' + (w.javaMode === "major" ? "checked" : "") + " /> Версия Java</label>" +
          '<select id="wz-java-major" style="width:auto">' + valid.map(function (j) {
            return '<option value="' + j.major + '"' + (j.major === w.javaMajor ? " selected" : "") + ">Java " + j.major + " — " + ui.esc(j.vendor || j.version || "") + "</option>";
          }).join("") + "</select></div>" +
          '<div class="hint" style="margin-top:6px">' + valid.length + " установлено версий. Рекомендуется та, что указана в карточке сборки после создания.</div>";
        jbox.querySelectorAll('input[name="wz-java-mode"]').forEach(function (r) {
          r.onchange = function () { w.javaMode = r.value; };
        });
        var sel = jbox.querySelector("#wz-java-major");
        sel.onchange = function () { w.javaMajor = +this.value; w.javaMode = "major"; };
      } catch (e) {
        jbox.innerHTML = '<div class="hint">' + ui.esc(ui.errText(e)) + " — будет использован режим «Авто».</div>";
        w.javaMode = "auto";
      }
    }

    /* --- шаг 5 --- */
    function finalName() { return w.name.trim() || autoName(); }

    function step5() {
      var t = presetById(w.preset);
      body.innerHTML = stepHead("Готово к созданию") +
        '<div class="ipl-summary">' +
          row("Название", finalName() + (w.name.trim() ? "" : " (авто)")) +
          (w.description ? row("Описание", w.description) : "") +
          row("Шаблон", t.t) +
          row("Minecraft", w.mcVersion || "—") +
          row("Загрузчик", (LOADER_LABELS[w.loader] || "Vanilla") + (w.loaderVersion ? " " + w.loaderVersion : "")) +
          row("Java", w.javaMode === "auto" ? "Авто" : "Java " + w.javaMajor) +
          row("Память", w.ramMin + "–" + w.ramMax + " МБ") +
          row("Иконка", w.iconPath ? w.iconPath.split(/[\\/]/).pop() : "стандартная") +
        "</div>" +
        (t.mods.length
          ? '<div class="field"><label>Будут установлены моды (Modrinth)</label><div class="wz-mods">' +
            t.mods.map(function (m) { return '<span class="chip">' + ui.esc(m.name) + "</span>"; }).join("") +
            "</div></div>"
          : "") +
        '<div class="hint">' + (t.mods.length
          ? "После создания моды установятся автоматически. Если для выбранной версии совместимой сборки нет — покажем предупреждение."
          : "Кнопка «Создать сборку» создаст папку сборки и откроет её страницу.") + "</div>" +
        '<div class="wz-status" id="wz-status"></div>';
      function row(k, v) {
        return '<div class="srow"><span class="k">' + ui.esc(k) + '</span><span class="v">' + ui.esc(v) + "</span></div>";
      }
    }

    function setStepStatus(msg) {
      var el = body.querySelector("#wz-status");
      if (el) el.textContent = msg || "";
    }

    /* реальная установка модов шаблона через Modrinth */
    async function installTemplateMods(instanceId) {
      var t = presetById(w.preset);
      var ok = [], skipped = [], failed = [];
      for (var i = 0; i < t.mods.length; i++) {
        var m = t.mods[i];
        setStepStatus("Установка модов: " + m.name + " (" + (i + 1) + "/" + t.mods.length + ")…");
        try {
          var vers = (await api("modrinth.versions", {
            id: m.slug, loaders: [w.loader], gameVersions: [w.mcVersion],
          })) || [];
          var pick = vers.find(function (v) { return v.versionType === "release"; }) || vers[0];
          if (!pick) { skipped.push(m.name); continue; }
          await api("modrinth.install", { instanceId: instanceId, versionId: pick.id, kind: "mods" });
          ok.push(m.name);
        } catch (e) { failed.push(m.name + ": " + ui.errText(e)); }
      }
      return { ok: ok, skipped: skipped, failed: failed };
    }

    function renderStep() {
      showError("");
      if (w.step === 1) step1();
      else if (w.step === 2) step2();
      else if (w.step === 3) step3();
      else if (w.step === 4) step4();
      else step5();
      chrome();
    }

    function validate() {
      if (w.step === 2 && !w.mcVersion) return "Выберите версию Minecraft.";
      if (w.step === 3 && w.loader !== "vanilla" && !w.loaderVersion) return "Выберите версию загрузчика.";
      if (w.step === 4 && w.ramMax < w.ramMin) return "Максимальная память не может быть меньше минимальной.";
      return null;
    }

    async function nextStep() {
      if (w.creating) return false;
      if (w.step < 5) {
        var err = validate();
        if (err) { showError(err); return false; }
        w.step++;
        renderStep();
        return false;
      }
      /* финальное создание */
      var err5 = validate();
      if (err5) { showError(err5); return false; }
      w.creating = true;
      chrome();
      var name = finalName();
      try {
        var payload = {
          name: name,
          description: w.description.trim(),
          color: w.color,
          mcVersion: w.mcVersion,
          loader: w.loader,
          ramMinMb: w.ramMin,
          ramMaxMb: w.ramMax,
        };
        if (w.iconPath) payload.iconPath = w.iconPath;
        if (w.loader !== "vanilla" && w.loaderVersion) payload.loaderVersion = w.loaderVersion;
        if (w.javaMode === "major" && w.javaMajor) payload.java = w.javaMajor;
        var created = await api("instances.create", payload);
        var t = presetById(w.preset);
        if (t.mods.length) {
          var res = await installTemplateMods(created.id);
          if (res.skipped.length) {
            ui.notifyWarn("Моды пропущены",
              "Нет совместимой версии для " + w.mcVersion + " / " + (LOADER_LABELS[w.loader] || "Vanilla") + ": " + res.skipped.join(", "));
          }
          if (res.failed.length) ui.notifyError(null, "Не установились: " + res.failed.join("; "));
          if (res.ok.length) ui.notifySuccess("Моды установлены", res.ok.join(", "));
        }
        ui.notifySuccess("Сборка создана", created && created.name ? created.name : name);
        dlg.close();
        navigate("instance", { id: created.id });
        return false;
      } catch (e) {
        w.creating = false;
        setStepStatus("");
        chrome();
        showError(ui.errText(e));
        var d = ui.errDetail(e);
        if (d) ui.notifyError(e, "Подробнее: " + d.slice(0, 180));
        return false;
      }
    }

    renderStep();
  }

  /* ---------- загрузка данных ---------- */
  async function reload() {
    S.loading = true;
    S.error = null;
    renderBody();
    try {
      var list = (await api("instances.list")) || [];
      if (S.dead) return;
      S.list = list;
      S.loading = false;
      renderGroups();
      renderBody();
    } catch (e) {
      if (S.dead) return;
      S.loading = false;
      S.error = e;
      renderCount();
      renderBody();
    }
    try {
      var groups = (await api("groups.list")) || [];
      if (S.dead) return;
      S.groups = groups;
      renderGroups();
    } catch (e) { /* группы — необязательные, тихо пропускаем */ }
  }

  /* ---------- register ---------- */
  Pages.register("instances", {
    title: "Мои сборки",
    createInstance() { openWizard(); },

    async init(ctx) {
      S.dead = false;
      S.view = App.settings.instanceView === "list" ? "list" : "grid";
      S.sort = App.settings.instanceSort || "name";
      S.group = null;
      S.q = ctx.params.version ? String(ctx.params.version) : "";
      S.loading = true;
      S.error = null;

      var root = ctx.root;
      S.els = {
        count: root.querySelector("#ipl-count"),
        groups: root.querySelector("#ipl-groups"),
        body: root.querySelector("#ipl-body"),
        q: root.querySelector("#ipl-q"),
        view: root.querySelector("#ipl-view"),
        sort: root.querySelector("#ipl-sort"),
      };

      /* шапка */
      root.querySelector("#ipl-create").onclick = function () { openWizard(); };
      root.querySelector("#ipl-import").onclick = importArchive;

      /* поиск */
      S.els.q.value = S.q;
      S.els.q.oninput = ui.debounce(function () { S.q = S.els.q.value; renderBody(); }, 180);

      /* вид */
      S.els.view.querySelectorAll("[data-view]").forEach(function (b) {
        b.classList.toggle("active", b.dataset.view === S.view);
        b.onclick = function () {
          S.view = b.dataset.view;
          S.els.view.querySelectorAll("[data-view]").forEach(function (x) { x.classList.toggle("active", x === b); });
          renderBody();
          api("settings.set", { instanceView: S.view }).then(function () { App.settings.instanceView = S.view; })
            .catch(function (e) { ui.notifyError(e, "Не удалось сохранить настройку"); });
        };
      });

      /* сортировка */
      S.els.sort.value = S.sort;
      S.els.sort.onchange = function () {
        S.sort = this.value;
        renderBody();
        api("settings.set", { instanceSort: S.sort }).then(function () { App.settings.instanceSort = S.sort; })
          .catch(function (e) { ui.notifyError(e, "Не удалось сохранить настройку"); });
      };

      /* drag&drop файлов */
      S.unsubs.push(on("files.dropped", function (d) {
        handleDropped(d && d.files);
      }));
      ui.onFilesDropped(function (files) {
        if (Date.now() - S.lastHostDrop < 2000) return;
        ui.notifyWarn("Не удалось определить путь файла",
          "Перетащённые файлы пришли без полного пути. Используйте кнопку «Импортировать».");
      });

      /* состояние запуска: показываем на карточках и поддерживаем в актуальном виде */
      S.unsubs.push(on("launch.state", function () { refreshRunning(); }));
      refreshRunning();
      if (S.runTimer) clearInterval(S.runTimer);
      S.runTimer = setInterval(function () { if (!S.dead) refreshRunning(); }, 5000);

      await reload();

      if (ctx.params.create) openWizard();
    },

    dispose() {
      S.dead = true;
      if (S.runTimer) { clearInterval(S.runTimer); S.runTimer = null; }
      S.unsubs.forEach(function (u) { try { u(); } catch (e) { /* noop */ } });
      S.unsubs = [];
      S.running = [];
      ui.onFilesDropped(null);
      S.els = {};
    },
  });
})();
</script>
