<style>
/* ===== settings — страница-специфичные стили (префикс sset-) ===== */
.sset-tip {
  width: 15px; height: 15px; border: 1px solid currentColor; border-radius: 50%;
  font-size: 9.5px; font-weight: 700; font-style: normal; display: inline-flex;
  align-items: center; justify-content: center; line-height: 1; flex: 0 0 auto;

.sset-swatch {
  width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: none;
  box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; transition: transform var(--t), box-shadow var(--t);
}
.sset-swatch:hover { transform: scale(1.14); }
.sset-swatch.active { box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 4px var(--c); }

.sset-hl { animation: ssetHl 2.6s ease; }
@keyframes ssetHl {
  0%, 65% { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  100% { background: transparent; box-shadow: none; }
}
.sset-skel { display: flex; flex-direction: column; gap: 10px; }
.sset-skel .skeleton { height: 46px; }
.sset-res { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; transition: background var(--t); width: 100%; }
.sset-res:last-child { border-bottom: none; }
.sset-res:hover { background: var(--card-2); }
.sset-res .t { font-size: 13.5px; font-weight: 600; display: block; }

.sset-res svg { width: 15px; height: 15px; color: var(--text-3); flex: 0 0 auto; }
.sset-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.sset-fact { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }

.sset-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.sset-code {
  font-family: var(--mono); font-size: 12.5px; background: var(--bg-1); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 10px; overflow-wrap: anywhere; user-select: text; margin-top: 8px;
}
.sset-check { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; padding: 7px 0; }
.sset-check svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; }
.sset-check.ok svg { color: var(--accent); }
.sset-check.warn svg { color: var(--warn); }
.sset-check.err svg { color: var(--danger); }
.sset-check .m { color: var(--text-2); font-size: 12px; margin-top: 2px; line-height: 1.5; }
.sset-hint { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.sset-logbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.sset-logbar select, .sset-logbar input { width: auto; min-width: 150px; }
.sset-logbar .grow { flex: 1; min-width: 120px; }
.sset-hk { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.sset-hk:last-child { border-bottom: none; }
.sset-hk .info { flex: 1; min-width: 0; }
.sset-hk .t { font-size: 13.5px; font-weight: 600; }
.sset-hk .d { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.sset-hk input { width: 180px; text-align: center; font-family: var(--mono); font-size: 12.5px; cursor: pointer; }
.sset-hk input:focus { border-color: var(--accent); }
.sset-table td { vertical-align: middle; }
.sset-empty { padding: 40px 20px; }
/* компоненты (перенесены с главной) */
.sset-cmp { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sset-cmp:last-of-type { border-bottom: none; }
.sset-cmp .logo { width: 34px; height: 34px; border-radius: 8px; background: #fff; display: grid; place-items: center; flex: 0 0 auto; overflow: hidden; padding: 3px; box-sizing: border-box; }
.sset-cmp .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.sset-cmp .logo.sprite { background: var(--accent-soft); color: var(--accent); padding: 0; }
.sset-cmp .logo.sprite svg { width: 18px; height: 18px; }
.sset-cmp .grow { flex: 1; min-width: 0; }
.sset-cmp .name { font-weight: 600; font-size: 13px; }
.sset-cmp .det { font-size: 11.5px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sset-cmp .right { text-align: right; flex: 0 0 auto; }
.sset-cmp .ver { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.sset-cmp .date { font-size: 11px; color: var(--text-3); margin-top: 2px; white-space: nowrap; }

    reuseCache: "Не качать повторно файлы, уже имеющиеся в кэше (по хэшу).",
    networkTimeoutSec: "Сколько секунд ждать ответа от сервера.",
    retryCount: "Число автоматических повторов загрузки.",
    speedLimitKbs: "КБ/с, 0 — без ограничения.",
    resumeInterrupted: "Продолжать незавершённые загрузки после перезапуска.",
    proxyType: "None, System, HTTP, HTTPS или SOCKS5.",
    proxyHost: "Адрес прокси-сервера.",
    proxyPort: "Порт прокси-сервера.",
    modrinthPageSize: "Размер страницы поиска Modrinth.",
    modrinthOfflineCache: "Показывать сохранённые данные, если API недоступен.",
    modrinthAutoUpdateCheck: "Проверять обновления проектов при запуске.",
    notifyToasts: "Собственные уведомления лаунчера внутри окна.",
    notifyDownloadDone: "Сообщать об окончании скачивания.",
    notifyLaunchDone: "Сообщать о завершении игры.",
    notifyModUpdates: "Сообщать, когда у модов появилась новая версия.",
    notifySound: "Звуковой сигнал при уведомлении.",
    logLevel: "Debug, Info, Warn или Error.",
    logRetentionDays: "Старые файлы логов удаляются автоматически.",
    debugMode: "Подробные логи запуска и сети.",
    crashAutoAnalyze: "Автоматически разбирать отчёты о сбоях игры.",
    telemetry: "Анонимная статистика использования. По умолчанию выключена.",
    saveTokenSecure: "Токены аккаунтов шифруются через DPAPI (Windows Credential store).",
    lowResourceMode: "Уменьшает фоновую активность лаунчера.",
    apiCacheMinutes: "Время жизни кэша ответов Modrinth и манифестов.",
    lazyImages: "Подгружать изображения по мере появления в viewport.",
  };

  /* значения по умолчанию — Core/SettingsRegistry.cs (Defaults) */
  var DEFAULTS = {
    theme: "dark", accent: "#3ecf8e", density: "normal", uiScale: 100, fontScale: 1.0,
    animations: true, rounding: "normal", opacity: 100, highContrast: false, cardSize: "normal",
    startPage: "home", showSidebarLabels: true, language: "ru", confirmDelete: true,
    closeToTray: false, checkUpdatesOnStart: true, onboardingDone: false, expertMode: false,
    currentProfile: "default", dataDir: "", instanceSort: "lastPlayed", instanceView: "grid",
    showFavoritesFirst: true, showSnapshots: false, showOldVersions: false, autoBackup: true,
    backupBeforeUpdate: true, backupRetention: 5, javaAuto: true, javaMajor: 21, javaPath: "",
    ramMinMb: 512, ramMaxMb: 4096, ramRecommend: true, jvmArgsDefault: "",
    windowMode: "windowed", windowWidth: 1920, windowHeight: 1080, fullscreen: false,
    vsync: true, fpsLimit: 120, closeLauncherOnLaunch: false, safeModeByDefault: false,
    downloadThreads: 8, maxConcurrentDownloads: 6, verifyHashes: true, reuseCache: true,
    networkTimeoutSec: 60, retryCount: 3, speedLimitKbs: 0, resumeInterrupted: true,
    proxyType: "none", proxyHost: "", proxyPort: 8080, proxyUser: "", proxyPass: "", proxySystem: true,
    modrinthPageSize: 20, modrinthOfflineCache: true, modrinthAutoUpdateCheck: true,
    notifyToasts: true, notifyDownloadDone: true, notifyLaunchDone: true, notifyModUpdates: true,
    notifySound: false, logLevel: "info", logRetentionDays: 14, debugMode: false,
    crashAutoAnalyze: true, telemetry: false, saveTokenSecure: true, lazyImages: true,
    apiCacheMinutes: 15, lowResourceMode: false, accountUuid: "", activeInstance: "",
    expNewUi: false, expParallelDownloads: true, expAdvancedModScanner: true,
    expAutoCrashAnalysis: true, expInstanceSync: false,
  };

  var ACCENTS = ["#3ecf8e", "#4da3ff", "#8b5cf6", "#ef5b64", "#eea23c", "#22d3ee"];
  var LOOK = { theme: 1, accent: 1, density: 1, uiScale: 1, fontScale: 1, animations: 1, rounding: 1, opacity: 1, highContrast: 1 };
  var DEFS = {
    general: { title: "Общие", render: renderGeneral },
    appearance: { title: "Внешний вид", render: renderAppearance },
    instances: { title: "Сборки", render: renderInstances },
    java: { title: "Java", render: renderJava },
    ram: { title: "RAM и память", render: renderRam },
    launch: { title: "Параметры запуска", render: renderLaunch },
    network: { title: "Сеть и прокси", render: renderNetwork },
    modrinth: { title: "Modrinth", render: renderModrinth },
    downloads: { title: "Загрузки", render: renderDownloads },
    notifications: { title: "Уведомления", render: renderNotifications },
    storage: { title: "Хранилище", render: renderStorage },
    backup: { title: "Резервные копии", render: renderBackup },
    performance: { title: "Производительность", render: renderPerformance },
    logs: { title: "Логи и отчёты", render: renderLogs },
    hotkeys: { title: "Горячие клавиши", render: renderHotkeys },
    privacy: { title: "Конфиденциальность", render: renderPrivacy },
    advanced: { title: "Расширенные", render: renderAdvanced },
    about: { title: "О программе", render: renderAbout },
  };

  var S = {
    dead: false, ctx: null, section: "general", q: "", values: null,
    timers: {}, pending: {}, unsubs: [], suppress: 0, hook: null,
    onQ: null, hlTimer: null, els: {}, dialogs: [],
  };

  /* Диалог, открытый со страницы: закрывается при dispose, чтобы не
     оставались опросы (device-code) и подписки (java.install.progress). */
  function openPageDialog(opts) {
    var prevClose = opts.onClose;
    var ctx = ui.openDialog(Object.assign({}, opts, {
      onClose: function () {
        var i = S.dialogs.indexOf(ctx);
        if (i >= 0) S.dialogs.splice(i, 1);
        if (prevClose) prevClose();
      },
    }));
    S.dialogs.push(ctx);
    return ctx;
  }

  /* ---------- значения ---------- */
  function get(k) {
    if (S.values && S.values[k] !== undefined && S.values[k] !== null) return S.values[k];
    if (DEFAULTS[k] !== undefined) return DEFAULTS[k];
    if (App.settings && App.settings[k] !== undefined && App.settings[k] !== null) return App.settings[k];
    return "";
  }

  function normalizeVal(key, val) {
    if (key === "accent") {
      var v = String(val || "").trim();
      if (v && v[0] !== "#") v = "#" + v;
      if (/^#[0-9a-fA-F]{6}$/.test(v)) return v.toLowerCase();
      return get("accent");
    }
    return val;
  }

  function setVal(key, value, immediate) {
    if (!S.values) S.values = {};
    S.values[key] = value;
    if (!App.settings) App.settings = {};
    App.settings[key] = value;
    var valid = (key !== "accent") || /^#[0-9a-fA-F]{6}$/.test(String(value));
    if (LOOK[key] && valid) { try { ui.applySettings(S.values); } catch (e) { /* noop */ } }

    /* неполный HEX (набирается вручную) — держим локально, но не сохраняем */
    if (!valid) {
      if (S.timers[key]) { clearTimeout(S.timers[key]); delete S.timers[key]; }
      delete S.pending[key];
      if (S.hook) { try { S.hook(key, value); } catch (e) { console.error(e); } }
      return;
    }

    if (S.timers[key]) { clearTimeout(S.timers[key]); delete S.timers[key]; }
    if (immediate) {
      delete S.pending[key];
      persist(key, value);
    } else {
      S.pending[key] = value;
      S.timers[key] = setTimeout(function () {
        delete S.timers[key];
        var v = S.pending[key];
        delete S.pending[key];
        persist(key, v);
      }, 400);
    }
    if (S.hook) { try { S.hook(key, value); } catch (e) { console.error(e); } }
  }

  function persist(key, value) {
    S.suppress = Date.now() + 1200;
    var patch = {};
    patch[key] = value;
    return api("settings.set", patch).catch(function (e) {
      if (S.dead) return;
      ui.notifyError(e, "Не удалось сохранить настройку");
    });
  }

  function onSettingsChanged(data) {
    if (S.dead || !data) return;
    if (!S.values) S.values = {};
    Object.assign(S.values, data);
    App.settings = S.values;
    var looks = Object.keys(data).some(function (k) { return LOOK[k]; });
    if (looks) { try { ui.applySettings(S.values); } catch (e) { /* noop */ } }
    if (Date.now() < S.suppress) return;              /* эхо собственного settings.set */
    if (S.q) return;                                   /* сейчас показаны результаты поиска */
    var pane = S.els.panes;
    if (pane && pane.contains(document.activeElement)) return;  /* не прерываем ввод */
    renderSection();
  }

  /* ---------- каркас отрисовки ---------- */
  function esc(s) { return ui.esc(s); }

  function errBlock(e, retry) {
    var d = ui.errDetail(e);
    return '<div class="state error">' + ui.icon("alert") + "<h3>Не удалось загрузить</h3><p>" + esc(ui.errText(e)) + "</p>" +

      (retry ? '<div class="actions"><button class="btn" data-retry="1">' + ui.icon("refresh") + " Повторить</button></div>" : "") +
      "</div>";
  }

  function bindRetry(root, fn) {
    var b = root.querySelector("[data-retry]");
    if (b) b.onclick = fn;
  }

  function skelRows(n) {
    var h = "";
    for (var i = 0; i < (n || 3); i++) h += '<div class="skeleton"></div>';
    return '<div class="sset-skel">' + h + "</div>";
  }

  function emptyState(ic, title, text, actions) {
    return '<div class="state">' + ui.icon(ic) + "<h3>" + esc(title) + "</h3><p>" + esc(text) + "</p>" +
      (actions ? '<div class="actions">' + actions + "</div>" : "") + "</div>";
  }

  function card(title, ic, body) {
    return '<div class="card"><div class="card-title">' + (ic ? ui.icon(ic) : "") + esc(title) + "</div>" + body + "</div>";
  }

  function tipFor(key) {
    return HINTS[key] ? '<span class="tip sset-tip" data-tip="' + esc(HINTS[key]) + '">i</span>' : "";
  }

  function row(key, title, desc, ctrl, wide) {
    return '<div class="set-row"' + (key ? ' data-key="' + key + '"' : "") + ">" +
      '<div class="set-info"><div class="set-title">' + esc(title) + tipFor(key) + "</div>" +
      (desc ? '<div class="set-desc">' + esc(desc) + "</div>" : "") + "</div>" +
      '<div class="set-ctrl' + (wide ? " wide" : "") + '">' + (ctrl || "") + "</div></div>";
  }

  function sw(k) {
    return '<label class="switch"><input type="checkbox" data-set="' + k + '" data-ctl="switch"' + (get(k) ? " checked" : "") + "><i></i></label>";
  }

  function sel(k, opts, num) {
    var cur = String(get(k));
    var h = '<select data-set="' + k + '" data-ctl="select"' + (num ? ' data-num="1"' : "") + ' style="width:auto;min-width:160px">';
    opts.forEach(function (o) {
      h += '<option value="' + esc(o[0]) + '"' + (String(o[0]) === cur ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    });
    return h + "</select>";
  }

  function rng(k, min, max, step, unit, scale) {
    scale = scale || 1;
    var disp = Math.round(Number(get(k)) * scale);
    return '<input type="range" data-set="' + k + '" data-ctl="range" min="' + min + '" max="' + max + '" step="' + (step || 1) +
      '" value="' + disp + '" data-scale="' + scale + '" style="width:170px">' +
      '<span class="sset-val" data-show="' + k + '" data-unit="' + esc(unit || "") + '">' + disp + esc(unit || "") + "</span>";
  }

  function numIn(k, opts) {
    opts = opts || {};
    return '<input type="number" data-set="' + k + '" data-ctl="number" data-num="1" value="' + esc(String(get(k))) + '"' +
      (opts.min !== undefined && opts.min !== null ? ' min="' + opts.min + '"' : "") +
      (opts.max !== undefined && opts.max !== null ? ' max="' + opts.max + '"' : "") +
      ' step="' + (opts.step || 1) + '" style="width:' + (opts.w || 110) + 'px">' +
      (opts.unit ? '<span class="dim small nowrap">' + esc(opts.unit) + "</span>" : "");
  }

  function txtIn(k, opts) {
    opts = opts || {};
    return '<input type="' + (opts.type || "text") + '" data-set="' + k + '" data-ctl="text" value="' + esc(String(get(k) || "")) +
      '" placeholder="' + esc(opts.ph || "") + '" style="width:' + (opts.w || 240) + 'px">';
  }

  function seg(k, opts) {
    var cur = String(get(k));
    var h = '<div class="segmented" data-seg="' + k + '">';
    opts.forEach(function (o) {
      h += '<button type="button" data-val="' + esc(o[0]) + '"' + (String(o[0]) === cur ? ' class="active"' : "") + ">" + esc(o[1]) + "</button>";
    });

  }

  function btn(label, act, cls, ic) {
    return '<button class="btn btn-sm ' + (cls || "") + '" data-act="' + act + '">' + (ic ? ui.icon(ic) : "") + esc(label) + "</button>";

  function syncAccent(pane, value) {
    if (!pane || !pane.querySelector) return;
    var v = String(value || "").trim();
    if (v && v[0] !== "#") v = "#" + v;
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    var low = v.toLowerCase();
    pane.querySelectorAll("[data-color]").forEach(function (b) {
      b.classList.toggle("active", String(b.dataset.color).toLowerCase() === low);
    });
    var hex = pane.querySelector("[data-hex]");
    if (hex && document.activeElement !== hex && String(hex.value).toLowerCase() !== low) hex.value = low;
    var col = pane.querySelector('[data-ctl="color"]');
    if (col && String(col.value).toLowerCase() !== low) col.value = low;
  }

  function bind(pane, acts) {
    pane.querySelectorAll("[data-set]").forEach(function (el) {
      var key = el.dataset.set, ctl = el.dataset.ctl;
      if (ctl === "switch") {
        el.onchange = function () { setVal(key, !!el.checked, true); };
      } else if (ctl === "select") {
        el.onchange = function () { setVal(key, el.dataset.num ? Number(el.value) : el.value, true); };
      } else if (ctl === "number") {
        el.oninput = function () { if (el.value !== "") setVal(key, Number(el.value), false); };
        el.onchange = function () { if (el.value !== "") setVal(key, Number(el.value), true); };
      } else if (ctl === "range") {
        var scale = Number(el.dataset.scale || 1);
        el.oninput = function () {
          var disp = Number(el.value);
          var show = el.parentNode ? el.parentNode.querySelector("[data-show]") : null;
          if (show) show.textContent = disp + (show.dataset.unit || "");
          setVal(key, scale !== 1 ? disp / scale : disp, false);
        };
      } else if (ctl === "color") {
        el.oninput = function () { setVal(key, el.value, false); syncAccent(pane, el.value); };
        el.onchange = function () { setVal(key, normalizeVal(key, el.value), true); syncAccent(pane, get(key)); };
      } else {
        el.oninput = function () { setVal(key, el.value, false); syncAccent(pane, el.value); };
        el.onchange = function () {
          var nv = normalizeVal(key, el.value);
          el.value = nv;
          setVal(key, nv, true);
          syncAccent(pane, nv);
        };
      }
    });
    pane.querySelectorAll("[data-seg]").forEach(function (g) {
      g.querySelectorAll("button").forEach(function (b) {
        b.onclick = function () {
          setVal(g.dataset.seg, b.dataset.val, true);
          g.querySelectorAll("button").forEach(function (x) { x.classList.toggle("active", x === b); });
        };
      });
    });
    pane.querySelectorAll("[data-act]").forEach(function (b) {
      var fn = acts && acts[b.dataset.act];
      if (fn) b.onclick = function () { fn(b, pane); };
    });
  }

  function renderResults(list) {
    var pane = S.els.panes;
    if (!list.length) {
      pane.innerHTML = emptyState("search", "Ничего не найдено", "По запросу «" + S.q + "» настроек нет.",
        '<button class="btn" data-act="clear-q">Сбросить поиск</button>');

    var h = '<div class="card"><div class="card-title">' + ui.icon("search") + "Найдено настроек: " + list.length + '</div><div class="sset-results">';
    list.forEach(function (r, i) {

        '<span class="t">' + esc(r.title || r.key) + "</span>" +

  async function doSearch(q) {
    var pane = S.els.panes;
    if (!pane) return;
    pane.innerHTML = skelRows(3);
    try {
      var res = await api("settings.search", { query: q });
      if (S.dead || q !== S.q) return;
      renderResults(res || []);
    } catch (e) {
      if (S.dead) return;
      pane.innerHTML = errBlock(e, true);
      bindRetry(pane, function () { doSearch(q); });
    }
  }

  function highlightKey(key) {
    var pane = S.els.panes;
    if (!pane || !key) return;
    var el = pane.querySelector('.set-row[data-key="' + key + '"]');
    if (!el) return;
    el.classList.add("sset-hl");
    try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { /* noop */ }
    if (S.hlTimer) clearTimeout(S.hlTimer);
    S.hlTimer = setTimeout(function () { el.classList.remove("sset-hl"); S.hlTimer = null; }, 2800);
  }

  /* ---------- register ---------- */
  Pages.register("settings", {
    title: "Настройки",
    async init(ctx) {
      S.dead = false;
      S.ctx = ctx;
      S.values = null;
      S.q = "";
      S.hook = null;
      S.suppress = 0;
      S.els = {
        nav: ctx.root.querySelector("#sset-nav"),
        panes: ctx.root.querySelector("#sset-panes"),
        sub: ctx.root.querySelector("#sset-sub"),
        q: ctx.root.querySelector("#sset-q"),
      };
      S.section = (ctx.params.section && DEFS[ctx.params.section]) ? String(ctx.params.section) : "general";
      renderNav();
      S.els.panes.innerHTML = skelRows(4);

      var qEl = S.els.q;
      S.onQ = ui.debounce(function () {
        S.q = String(qEl.value || "").trim();
        if (S.q) doSearch(S.q); else renderSection();
      }, 300);
      qEl.addEventListener("input", S.onQ);

      S.unsubs.push(on("settings.changed", onSettingsChanged));

      try {
        var vals = await api("settings.get");
        if (S.dead) return;
        S.values = vals || {};
        App.settings = S.values;
        ui.applySettings(S.values);
      } catch (e) {
        if (S.dead) return;
        S.els.panes.innerHTML = errBlock(e, true);
        bindRetry(S.els.panes, function () { ctx.reload(); });
        return;
      }

      var hl = ctx.params.q ? String(ctx.params.q) : "";
      if (hl && ctx.params.section) {
        renderSection();
        highlightKey(hl);
        return;
      }
      if (hl) {
        S.q = hl;
        qEl.value = hl;
        await doSearch(hl);
        return;
      }
      renderSection();
    },

    dispose() {
      S.dead = true;
      if (S.onQ && S.els.q) S.els.q.removeEventListener("input", S.onQ);
      S.onQ = null;
      Object.keys(S.timers).forEach(function (k) { clearTimeout(S.timers[k]); delete S.timers[k]; });
      Object.keys(S.pending).forEach(function (k) {           /* дописываем несохранённое */
        var v = S.pending[k];
        delete S.pending[k];
        persist(k, v);
      });
      if (S.hlTimer) { clearTimeout(S.hlTimer); S.hlTimer = null; }
      S.unsubs.forEach(function (u) { try { u(); } catch (e) { /* noop */ } });
      S.unsubs = [];
      S.dialogs.slice().forEach(function (d) { try { d.close(); } catch (e) { /* noop */ } });
      S.dialogs = [];
      S.hook = null;
      S.els = {};
    },
  });

  async function runPing(btnEl, pane) {
    if (btnEl) btnEl.classList.add("loading");
    var box = pane.querySelector("#sset-ping");
    if (box) box.innerHTML = skelRows(3);
    try {
      var r = await api("system.ping");
      if (btnEl) btnEl.classList.remove("loading");
      if (!box || !box.isConnected) return;
      var items = (r && r.items) || [];
      if (!items.length) { box.innerHTML = '<div class="sset-hint">Серверы для проверки не найдены.</div>'; return; }
      var h = '<div class="sset-facts">';
      items.forEach(function (it) {
        var cls = it.ok ? (it.ms <= 300 ? "ok" : it.ms <= 800 ? "warn" : "danger") : "danger";
        h += '<div class="sset-fact"><div class="k">' + esc(it.title) + "</div>" +
          '<div class="v"><span class="chip ' + cls + '">' +
          (it.ok ? ui.fmtNum(it.ms) + " мс" : "нет связи") + "</span>" +
          (it.detail ? '<span class="dim small" style="margin-left:6px">' + esc(it.detail) + "</span>" : "") +
          "</div></div>";
      });
      h += "</div>";
      box.innerHTML = h;
    } catch (e) {
      if (btnEl) btnEl.classList.remove("loading");
      if (box && box.isConnected) {
        box.innerHTML = errBlock(e, true);
        bindRetry(box, function () { runPing(btnEl, pane); });
      } else {
        ui.notifyError(e, "Не удалось проверить пинг");
      }
    }
  }

    if (S.dead || !S.els.panes || !S.els.panes.querySelector) return;
    var box = S.els.panes.querySelector("#sset-javas");

      if (!list.length) {

        "</tr></thead><tbody>";

  function installJavaDialog() {
    var body = document.createElement("div");
    body.className = "col";
    body.innerHTML =
      '<div class="field"><label>Версия Java</label>' +
      '<select id="sset-jver"><option value="21">Java 21 — рекомендуется (1.20.5+)</option>' +
      '<option value="17">Java 17 — Minecraft 1.18–1.20.4</option>' +

      '<option value="25">Java 25 — экспериментальная</option></select>' +
      '<div class="hint">Скачивается Eclipse Temurin в папку java/ лаунчера.</div></div>' +
      '<div id="sset-jprog" hidden><div class="progress"><i style="width:0%"></i></div>' +
      '<div class="sset-hint" id="sset-jprog-t" style="margin-top:6px"></div></div>';

    var unsub = null;
    var dlg = openPageDialog({
      title: "Установить Java",
      icon: "coffee",
      body: body,
      buttons: [
        { label: "Отмена", role: "cancel" },
        {
          label: "Установить", role: "primary", keepOpen: true,
          onClick: async function (dctx) {
            var major = Number(body.querySelector("#sset-jver").value);
            var prog = body.querySelector("#sset-jprog");
            var bar = prog.querySelector(".progress > i");
            var txt = body.querySelector("#sset-jprog-t");
            prog.hidden = false;
            txt.textContent = "Подготовка…";
            if (!unsub) {
              unsub = on("java.install.progress", function (d) {
                if (!d) return;
                var p = typeof d.progress === "number" ? (d.progress <= 1 ? d.progress * 100 : d.progress) : 0;
                bar.style.width = Math.max(0, Math.min(100, p)).toFixed(1) + "%";
                txt.textContent = d.done ? "Готово" : "Скачивание Java " + (d.major || major) + "… " + Math.round(p) + "%";
              });
            }
            try {
              var r = await api("java.install", { major: major });
              bar.style.width = "100%";
              txt.textContent = "Готово";
              ui.notifySuccess("Java установлена", (r && r.path) ? String(r.path) : "Java " + major);
              if (!S.dead) loadJava();
              if (unsub) { try { unsub(); } catch (e) { /* noop */ } unsub = null; }
              dctx.close();
            } catch (e) {
              prog.hidden = true;
              ui.notifyError(e, "Не удалось установить Java");
              if (unsub) { try { unsub(); } catch (e2) { /* noop */ } unsub = null; }
            }
            return false;
          },
        },
      ],
      onClose: function () {
        if (unsub) { try { unsub(); } catch (e) { /* noop */ } unsub = null; }
      },
    });
  }

  /* ---------- RAM и память ---------- */
  var RAM_PRESETS = [1024, 2048, 3072, 4096, 6144, 8192, 12288, 16384];

  function ramCtrl(k) {
    var v = Number(get(k));
    var has = RAM_PRESETS.indexOf(v) >= 0;
    var h = '<select data-set="' + k + '" data-ctl="select" data-num="1" style="width:auto;min-width:130px">';
    if (!has) h += '<option value="' + v + '" selected>Свой: ' + v + " МБ</option>";
    RAM_PRESETS.forEach(function (p) {
      h += '<option value="' + p + '"' + (p === v ? " selected" : "") + ">" + (p >= 1024 ? (p / 1024) + " ГБ" : p + " МБ") + "</option>";
    });
    h += "</select>";
    return h + numIn(k, { min: 256, max: 65536, w: 110, unit: "МБ" });
  }

    pane.innerHTML =
      card("Память Java", "memory",
        row("ramMinMb", "Минимальная RAM", "Стартовый объём памяти Java (-Xms).", ramCtrl("ramMinMb")) +
        row("ramMaxMb", "Максимальная RAM", "Предел памяти Java (-Xmx). Больше физически доступной — ошибка запуска.", ramCtrl("ramMaxMb")) +
        row("ramRecommend", "Подсказывать объём памяти", "Показывать рекомендации по объёму RAM для сборки.", sw("ramRecommend")) +
        '<div id="sset-raminfo" style="margin-top:12px"></div>');

    bind(pane, {});
    S.hook = function (key) {
      if (key === "ramMinMb" || key === "ramMaxMb" || key === "ramRecommend") updateRamInfo();
    };
    // свежие значения занятой памяти (App.info статичен)
    api("system.info").then(function (info) {
      if (info) App.info = Object.assign({}, App.info || {}, info);
      updateRamInfo();
    }).catch(function () { updateRamInfo(); });

  function updateRamInfo() {
    if (S.dead || !S.els.panes || !S.els.panes.querySelector) return;
    var box = S.els.panes.querySelector("#sset-raminfo");
    if (!box) return;
    var total = (App.info && App.info.ramTotalMb) ? Number(App.info.ramTotalMb) : 0;
    var used = (App.info && App.info.ramUsedMb) ? Number(App.info.ramUsedMb) : 0;
    var load = (App.info && App.info.ramLoadPercent) ? Number(App.info.ramLoadPercent) : 0;
    var min = Number(get("ramMinMb")), max = Number(get("ramMaxMb"));
    var h = '<div class="sset-hint">Всего RAM в системе: <b class="tnum">' + (total ? ui.fmtNum(total) + " МБ" : "неизвестно") + "</b>" +
      (used ? ' · <b class="tnum">' + ui.fmtNum(used) + " МБ занято</b> (" + load + "%)" : "") +
      " · Рекомендуемый максимум для игр: 4096 МБ</div>";
    if (total && max > total) {
      h = '<div class="banner error" style="margin-bottom:8px">' + ui.icon("alert") +
        '<span class="grow">Максимальная память (' + ui.fmtNum(max) + " МБ) больше доступной RAM (" + ui.fmtNum(total) +
        " МБ) — Minecraft может не запуститься.</span></div>" + h;
    }
    if (max < min) {
      h = '<div class="banner warn" style="margin-bottom:8px">' + ui.icon("alert") +
        '<span class="grow">Максимум меньше минимума — исправьте значения.</span></div>' + h;
    }
    box.innerHTML = h;
  }

      if (S.dead || !box.isConnected) return;
      var items = Array.isArray(ov) ? ov : ((ov && Array.isArray(ov.items)) ? ov.items : []);
      var freeBytes = (ov && typeof ov === "object" && !Array.isArray(ov)) ? ov.freeBytes : null;
      if (!items.length) {
        box.innerHTML = emptyState("hdd", "Данных пока нет", "Кэш, загрузки и логи появятся после первого запуска.");
        return;
      }
      var total = items.reduce(function (s, it) { return s + (Number(it.bytes) || 0); }, 0);
      var h = "";
      if (freeBytes !== null && freeBytes !== undefined) {
        h += '<div class="sset-hint" style="margin-bottom:8px">Свободно на диске: <b class="tnum">' + ui.fmtBytes(freeBytes) + "</b>" +
          " · занято лаунчером: <b class=\"tnum\">" + ui.fmtBytes(total) + "</b></div>";
      } else {
        h += '<div class="sset-hint" style="margin-bottom:8px">Занято лаунчером: <b class="tnum">' + ui.fmtBytes(total) + "</b></div>";
      }
      h += '<div>';
      items.forEach(function (it) {
        var bytes = Number(it.bytes) || 0;
        var pct = total > 0 ? (bytes / total * 100) : 0;
        var clearable = ["cache", "downloads", "logs", "backups"].indexOf(String(it.key)) >= 0;
        h += '<div class="bar-row"><div class="bar-top">' +
          ui.icon(it.key === "logs" ? "file" : it.key === "backups" ? "save" : it.key === "downloads" ? "download" : "hdd") +
          "<span>" + esc(it.label || it.key) + "</span>" +
          '<span class="val">' + ui.fmtBytes(bytes) + (it.items ? " · " + ui.fmtNum(it.items) + " файлов" : "") + "</span>" +
          (clearable ? '<button class="btn btn-sm btn-ghost" data-clear="' + esc(it.key) + '">' + ui.icon("trash") + " Очистить</button>" : "") +
          "</div>" +
          '<div class="progress' + (pct > 85 ? " danger" : pct > 60 ? " warn" : "") + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
          (it.path ? '<div class="sset-hint mono" style="overflow-wrap:anywhere">' + esc(it.path) + "</div>" : "") +
          "</div>";
      });
      h += "</div>";
      box.innerHTML = h;
      box.querySelectorAll("[data-clear]").forEach(function (b) {
        b.onclick = function () { clearStorageKey(b.dataset.clear, b); };
      });
    } catch (e) {
      if (S.dead || !box.isConnected) return;
      box.innerHTML = errBlock(e, true);
      bindRetry(box, loadStorage);
    }
  }

  /* свежие данные system.info (занятая ОЗУ обновляется, App.info статичен) */
  function refreshSysInfo(pane) {
    api("system.info").then(function (info) {
      if (!info || !pane.isConnected) return;
      App.info = Object.assign({}, App.info || {}, info);
      var facts = pane.querySelectorAll(".sset-facts .sset-fact");
      facts.forEach(function (f) {
        var k = f.querySelector(".k"), v = f.querySelector(".v");
        if (!k || !v) return;
        if (k.textContent === "ОЗУ занято")
          v.textContent = info.ramUsedMb ? ui.fmtNum(info.ramUsedMb) + " МБ" +
            (info.ramLoadPercent ? " (" + info.ramLoadPercent + "%)" : "") : "—";
        else if (k.textContent === "ОЗУ свободно")
          v.textContent = info.ramFreeMb ? ui.fmtNum(info.ramFreeMb) + " МБ" : "—";
        else if (k.textContent === "ОЗУ всего")
          v.textContent = info.ramTotalMb ? ui.fmtNum(info.ramTotalMb) + " МБ" : "—";
      });
    }).catch(function () { /* noop */ });
  }

  async function runDiagnostics(btnEl, pane) {
    if (btnEl) btnEl.classList.add("loading");
    try {
      var res = await api("system.diagnose");
      if (btnEl) btnEl.classList.remove("loading");
      var checks = (res && Array.isArray(res.checks)) ? res.checks : [];
      if (!checks.length) {
        ui.notifyInfo("Диагностика", "Проверок не найдено");
        return;
      }
      var h = "";
      checks.forEach(function (c) {
        var cls = c.status === "ok" ? "ok" : c.status === "warn" ? "warn" : "err";
        var ic = c.status === "ok" ? "check" : "alert";
        h += '<div class="sset-check ' + cls + '">' + ui.icon(ic) +
          "<div><div><b>" + esc(c.title || c.id || "Проверка") + "</b></div>" +
          (c.message ? '<div class="m">' + esc(c.message) + "</div>" : "") + "</div></div>";
      });
      openPageDialog({
        title: "Диагностика лаунчера",
        icon: "zap",
        body: '<div style="max-height:52vh;overflow:auto">' + h + "</div>",
        buttons: [{ label: "Закрыть", role: "cancel" }],
      });
    } catch (e) {
      if (btnEl) btnEl.classList.remove("loading");
      ui.notifyError(e, "Не удалось выполнить диагностику");
    }
  }

  async function loadLogFiles(silent) {
    if (S.dead || !S.els.panes || !S.els.panes.querySelector) return;
    var pane = S.els.panes;
    var fEl = pane.querySelector("#sset-logf");
    if (!fEl) return;
    if (!silent) fEl.innerHTML = '<option value="">Загрузка…</option>';
    try {
      var list = await api("logs.listLauncher");
      if (S.dead || !fEl.isConnected) return;
      list = list || [];
      if (!list.length) {
        fEl.innerHTML = '<option value="">Логов нет</option>';
        pane.querySelector("#sset-logview").innerHTML = '<div class="log-view">' + esc("Файлы логов ещё не созданы.") + "</div>";
        S.logText = "";
        return;
      }
      var prev = fEl.value || list[0].name;
      fEl.innerHTML = list.map(function (f) {
        return '<option value="' + esc(f.name) + '"' + (f.name === prev ? " selected" : "") + ">" +
          esc(f.name) + (f.sizeBytes ? " · " + ui.fmtBytes(f.sizeBytes) : "") + "</option>";
      }).join("");
      await readLog();
    } catch (e) {
      if (S.dead || !fEl.isConnected) return;

  async function readLog() {
    if (S.dead || !S.els.panes || !S.els.panes.querySelector) return;
    var pane = S.els.panes;
    var view = pane.querySelector("#sset-logview");
    if (!view) return;
    var name = currentLogFile();
    if (!name) return;
    var qEl = pane.querySelector("#sset-logq");
    var lEl = pane.querySelector("#sset-logl");
    var query = qEl ? String(qEl.value || "").trim() : "";
    var level = lEl ? lEl.value : "";
    try {
      var res = await api("logs.readLauncher", { name: name, query: query, level: level || undefined });
      if (S.dead || !view.isConnected) return;
      var lines = (res && Array.isArray(res.lines)) ? res.lines : [];
      if (!lines.length) {
        view.innerHTML = '<div class="log-view">' + esc(query ? "Совпадений не найдено" : "Файл пуст") + "</div>";
        S.logText = "";
        return;
      }
      S.logText = lines.map(function (l) {
        return (l.ts ? "[" + l.ts + "] " : "") + (l.level ? l.level.toUpperCase() + " " : "") + (l.message || "");
      }).join("\n");
      var h = '<div class="log-view" style="max-height:46vh">';
      lines.forEach(function (l) {
        var lvl = String(l.level || "info").toUpperCase();
        h += '<div class="log-line ' + esc(lvl) + '">' +
          '<span class="ts">' + esc(shortTs(l.ts)) + "</span>" +
          '<span class="lvl">' + esc(lvl) + "</span>" +
          '<span class="msg">' + esc(l.message || "") + "</span></div>";
      });
      h += "</div>";
      view.innerHTML = h;
    } catch (e) {
      if (S.dead || !view.isConnected) return;
      view.innerHTML = errBlock(e, true);
      bindRetry(view, readLog);
    }
  }

  function shortTs(ts) {
    if (!ts) return "--:--:--";
    var d = new Date(ts);
    if (isNaN(d)) return String(ts).slice(11, 19) || String(ts);
    return d.toLocaleTimeString("ru-RU", { hour12: false });
  }

  function comboOf(e) {
    var parts = [];
    if (e.ctrlKey) parts.push("Ctrl");
    if (e.altKey) parts.push("Alt");
    if (e.shiftKey) parts.push("Shift");
    if (e.metaKey) parts.push("Win");
    var k = e.key;
    if (["Control", "Shift", "Alt", "Meta"].indexOf(k) >= 0) return null;
    if (k === " ") k = "Space";
    else if (k.length === 1) k = k.toUpperCase();
    else k = k.replace("Arrow", "");
    parts.push(k);
    return parts.join("+");
  }

  function hotkeysMap() {
    var base = {};
    Object.keys(ui.DefaultHotkeys).forEach(function (k) { base[k] = ui.DefaultHotkeys[k]; });
    var saved = get("hotkeys");
    if (saved && typeof saved === "object") Object.keys(saved).forEach(function (k) { base[k] = saved[k]; });
    return base;
  }

  function renderHotkeys(pane) {
    var map = hotkeysMap();
    var h = card("Сочетания клавиш", "key",
      '<div class="sset-hint" style="margin-bottom:6px">Нажмите на поле и соберите комбинацию: Ctrl, Alt, Shift, Win + клавиша. Escape — очистить поле.</div>');
    HK_ACTIONS.forEach(function (a) {
      h += '<div class="sset-hk"><div class="info"><div class="t">' + esc(a.t) + "</div>" +
        '<div class="d">' + esc(a.d) + "</div></div>" +
        '<input type="text" readonly data-hk="' + a.id + '" value="' + esc(map[a.id] || "") + '" placeholder="не назначено"></div>';
    });
    h += '<div class="sset-actions">' +
      btn("Сбросить всё", "hk-reset", "", "refresh") +
      btn("Сохранить", "hk-save", "btn-primary", "save") + "</div>";
    pane.innerHTML = h;

    var draft = Object.assign({}, map);
    pane.querySelectorAll("[data-hk]").forEach(function (inp) {
      inp.addEventListener("keydown", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === "Escape" || e.key === "Backspace" || e.key === "Delete") {
          draft[inp.dataset.hk] = "";
          inp.value = "";
          return;
        }
        var c = comboOf(e);
        if (!c) return;
        draft[inp.dataset.hk] = c;
        inp.value = c;
      });
    });

    bind(pane, {
      "hk-save": function (b) {
        S.values.hotkeys = draft;
        persist("hotkeys", draft);
        ui.notifySuccess("Горячие клавиши сохранены", "");
      },
      "hk-reset": function () {
        draft = Object.assign({}, ui.DefaultHotkeys);

      },
    });
  }

    if (btnEl) btnEl.classList.add("loading");
    var box = pane.querySelector("#sset-upd");
    try {
      var r = await api("system.checkUpdate");
      LATEST_UPD = r || null;
      if (btnEl) btnEl.classList.remove("loading");
      if (!box) return;
      if (r && r.sourceConfigured === false) {
        box.innerHTML = '<div class="banner info">' + ui.icon("alert") +
          '<span class="grow">Источник обновлений не настроен — проверка версий недоступна в этой сборке.</span></div>';
        return;
      }
      if (r && r.updateAvailable) {
        box.innerHTML = '<div class="banner warn">' + ui.icon("upload") +
          '<span class="grow">Доступна новая версия: <b>' + esc(r.current) + "</b> → <b>" + esc(r.latest) + "</b>" +
          (r.notes ? '<div class="sset-hint" style="margin-top:4px">' + esc(r.notes) + "</div>" : "") +
          '<div id="sset-upd-prog" style="margin-top:8px"></div></span></div>';
        var acts = document.createElement("div");
        acts.className = "sset-actions";
        var upd = document.createElement("button");
        upd.className = "btn btn-sm btn-primary";
        upd.textContent = "Установить обновление";
        upd.onclick = function () { installUpdate(box, upd); };
        var later = document.createElement("button");
        later.className = "btn btn-sm";
        later.textContent = "Позже";
        later.onclick = function () { box.innerHTML = ""; };
        acts.appendChild(upd);
        acts.appendChild(later);
        box.appendChild(acts);
        return;
      }
      box.innerHTML = '<div class="banner ok">' + ui.icon("check") +
        '<span class="grow">У вас последняя версия: <b>' + esc((r && r.current) || (App.info && App.info.appVersion) || "—") + "</b></span></div>";
    } catch (e) {
      if (btnEl) btnEl.classList.remove("loading");
      if (box) {
        box.innerHTML = errBlock(e, true);
        bindRetry(box, function () { checkUpdate(btnEl, pane); });
      } else {
        ui.notifyError(e, "Не удалось проверить обновление");
      }
    }
  }

  /* установка обновления: setup скачивается с релиза GitHub и запускается
     только после явного подтверждения пользователя */
  async function installUpdate(box, btnEl) {
    var r = LATEST_UPD;
    if (!r || !r.url) { ui.notifyError("Обновление недоступно", "Ссылка на установщик отсутствует"); return; }
    var ok = await ui.confirmDialog({
      title: "Установить обновление",
      messageHtml: true,
      message: "Будет скачан и запущен установщик <b>NullLauncher " + esc(r.latest || "") + "</b> из релиза на GitHub. " +
        "Лаунчер закроется, чтобы установщик мог обновить файлы. Продолжить?",
      okLabel: "Скачать и установить",
      cancelLabel: "Отмена",
    });
    if (!ok) return;

    var prog = box.querySelector("#sset-upd-prog");
    var unsub = on("update.progress", function (d) {
      if (!prog || !prog.isConnected) return;
      var pct = (d && typeof d.percent === "number") ? d.percent : 0;
      var txt = d && d.total ? " · " + ui.fmtBytes(d.received) + " из " + ui.fmtBytes(d.total) : "";
      prog.innerHTML = '<div class="sset-hint">Скачивание обновления: <b class="tnum">' + pct + "%</b>" + txt +
        '</div><div class="progress" style="height:6px;margin-top:4px"><div style="width:' + pct + '%;height:100%;background:var(--accent);border-radius:4px;transition:width .2s"></div></div>';
    });
    if (btnEl) btnEl.classList.add("loading");
    try {
      var res = await api("system.installUpdate", { url: r.url });
      if (unsub) { try { unsub(); } catch (e) { /* noop */ } }
      if (btnEl) btnEl.classList.remove("loading");
      ui.notifySuccess("Обновление скачано", "Запускаем установщик…");
      // лаунчер закрывается — файлы должны быть свободны для установщика
      if (res && res.started) setTimeout(function () { windowAction("close"); }, 600);
    } catch (e) {
      if (unsub) { try { unsub(); } catch (e2) { /* noop */ } }
      if (btnEl) btnEl.classList.remove("loading");
      ui.notifyError(e, "Не удалось установить обновление");
      if (prog) prog.innerHTML = "";
    }
  }
})();
</script>
