<style>
/* ===== home — главный экран: только герой, как на эталонном макете ===== */
.hero { position: relative; overflow: visible; border-radius: var(--r-lg); min-height: clamp(400px, calc(100vh - 205px), 640px); display: flex; flex-direction: column; justify-content: flex-end; }
#home-hero { margin-bottom: 30px; }
.hero-clip { position: absolute; inset: 0; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: #241a14; animation: home-rise .55s cubic-bezier(.22, .9, .3, 1) both; }
@keyframes home-rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .hero-clip, .hero-body, .hero-dock { animation: none; } }
.hero-bg { position: absolute; inset: 0; background: url("assets/hero.png") center/cover no-repeat; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 8, 6, 0.20) 0%, rgba(10, 8, 6, 0) 34%, rgba(10, 8, 6, 0.62) 100%); }
.hero-body { position: relative; padding: 26px 30px 102px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; max-width: 62%; animation: home-rise .55s .06s cubic-bezier(.22, .9, .3, 1) both; }
.hero-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 650; padding: 7px 13px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
.hero-badge svg { width: 14px; height: 14px; }
.hero-title { margin: 2px 0 0; font-size: clamp(26px, 3vw, 38px); font-weight: 800; letter-spacing: -0.5px; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45); display: flex; align-items: center; gap: 10px; min-width: 0; }
.hero-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-title .fav { color: #ffd75e; fill: #ffd75e; width: 20px; height: 20px; }
.hero-sub { margin: 0; color: rgba(255, 255, 255, 0.88); font-size: 13.5px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }
.hero-sub .chip { background: rgba(14, 11, 8, 0.52); border-color: rgba(255, 255, 255, 0.24); color: #fff; backdrop-filter: blur(4px); }
.hero-sub .chip img { width: 15px; height: 15px; object-fit: contain; background: #fff; border-radius: 3px; padding: 1px; margin-right: 3px; vertical-align: -3px; }
.hero-sub .chip svg { width: 13px; height: 13px; }
/* док — в левом нижнем углу обложки, наполовину выходит за её край (как на эталонном макете) */
.hero-dock { position: absolute; left: 24px; bottom: -26px; display: flex; align-items: flex-end; gap: 10px; animation: home-rise .55s .12s cubic-bezier(.22, .9, .3, 1) both; }
.hero-panel { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 12px; box-shadow: 0 14px 34px rgba(20, 16, 12, 0.24); flex: 0 0 auto; min-width: 0; }
.hero-panel .spacer { flex: none; width: 20px; }
.hero-panel .btn-lg { min-width: 168px; }
.hero-status { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.hero-status[hidden] { display: none; }
.hero-status .st-text { font-size: 12px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
.hero-status .progress { height: 5px; }
.hero-icon { height: 58px; width: 58px; border-radius: 16px; background: rgba(20, 16, 12, 0.72); border: 1px solid rgba(255, 255, 255, 0.16); display: grid; place-items: center; overflow: hidden; color: #fff; flex: 0 0 auto; box-shadow: 0 14px 34px rgba(20, 16, 12, 0.24); transition: transform var(--t), border-color var(--t); cursor: pointer; }
.hero-icon:hover { border-color: rgba(255, 255, 255, 0.4); transform: translateY(-1px); }
.hero-icon .item-icon { width: 100%; height: 100%; border-radius: 15px; font-size: 22px; display: grid; place-items: center; }
.hero-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* чип версии в доке */
.home-pchip { display: inline-flex; align-items: center; gap: 9px; padding: 6px 12px 6px 7px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--text); max-width: 240px; transition: background .15s, border-color .15s; flex: 0 0 auto; }
.home-pchip:hover { background: var(--card-3); border-color: var(--accent-line); }
.home-pchip .pc-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.home-pchip .pc-sub { flex: none; color: var(--text-3); font-weight: 400; font-size: 11.5px; }
.home-pchip svg { width: 13px; height: 13px; color: var(--text-3); flex: 0 0 auto; }
.home-pchip .pc-logo { width: 20px; height: 20px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; flex: 0 0 auto; }

/* служебные блоки героя */
.home-err { padding: 26px 12px; }
.home-err h3 { font-size: 14px; }
.home-details summary { cursor: pointer; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.home-details pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; color: var(--text-3); margin: 6px 0 0; font-family: var(--mono); }
.home-skel { display: flex; flex-direction: column; gap: 9px; }
.home-skel .skeleton { height: 40px; }
</style>

<section class="page">
  <div id="home-hero"></div>
  <div id="home-note"></div>
</section>

<script>
(function () {
  if (!Pages.register) Pages.register = function (route, def) { Pages[route] = def; };

  var S = {
    unsubs: [], activeId: null, playBtn: null, dead: false,
    running: [], runningLimit: 1, runTimer: null, list: [],
  };

  /* логотипы загрузчиков и компаний (настоящие файлы в UI/assets/logos) */
  var LOADER_LOGOS = {
    vanilla: "assets/logos/mojang.png",
    fabric: "assets/logos/fabric.png",
    forge: "assets/logos/forge.jpg",
    neoforge: "assets/logos/neoforge.png",
    quilt: "assets/logos/quilt.png",
  };
  var LOADER_LABELS = { vanilla: "Vanilla", fabric: "Fabric", forge: "Forge", neoforge: "NeoForge", quilt: "Quilt" };

  function loaderChip(l, ver) {
    var label = LOADER_LABELS[l] || l || "vanilla";
    var logo = LOADER_LOGOS[l];
    return '<span class="chip">' + (logo ? '<img src="' + logo + '" alt="" />' : "") +
      ui.esc(label) + (ver ? " " + ui.esc(ver) : "") + "</span>";
  }

  /* ---------- маленькие помощники ---------- */
  function errBlock(e, onRetry) {
    var d = ui.errDetail(e);
    return '<div class="state error home-err">' + ui.icon("alert") +
      "<h3>Не удалось загрузить</h3><p>" + ui.esc(ui.errText(e)) + "</p>" +
      (d ? '<details class="home-details"><summary>Подробнее</summary><pre>' + ui.esc(d) + "</pre></details>" : "") +
      (onRetry ? '<div class="actions"><button class="btn" data-retry="1">' + ui.icon("refresh") + " Повторить</button></div>" : "") +
      "</div>";
  }
  function bindRetry(box, fn) {
    var b = box.querySelector("[data-retry]");
    if (b) b.onclick = fn;
  }

  /* ---------- hero: выбрать активную сборку ---------- */
  function pickActive(list) {
    if (!list.length) return null;
    var bySetting = App.settings.activeInstance && list.find(function (i) { return i.id === App.settings.activeInstance; });
    if (bySetting) return bySetting;
    var played = list.filter(function (i) { return i.lastPlayedAt; })
      .sort(function (a, b) { return new Date(b.lastPlayedAt) - new Date(a.lastPlayedAt); });
    return played[0] || list[0];
  }

  function renderWelcome(box) {
    box.innerHTML =
      '<div class="hero">' +
        '<div class="hero-clip"><div class="hero-bg"></div><div class="hero-shade"></div></div>' +
        '<div class="hero-body">' +
          '<div class="hero-badge">' + ui.icon("cube") + " Добро пожаловать</div>" +
          '<h2 class="hero-title"><span>Сборок пока нет</span></h2>' +
          '<p class="hero-sub">Создайте свою сборку Minecraft или импортируйте готовый архив — и играйте в один клик.</p>' +
        "</div>" +
        '<div class="hero-dock"><div class="hero-panel">' +
          '<button class="btn btn-primary btn-lg" data-act="create">' + ui.icon("plus") + " Создать сборку</button>" +
          '<button class="btn" data-act="import">' + ui.icon("upload") + " Импортировать</button>" +
        "</div></div>" +
      "</div>";
    box.querySelector('[data-act="create"]').onclick = function () { navigate("instances", { create: 1 }); };
    box.querySelector('[data-act="import"]').onclick = importInstance;
  }

  async function importInstance() {
    try {
      var files = await api("system.pickFiles", { title: "Импорт сборки или модпака", filter: "pack" });
      if (!files || !files.length) return;
      for (var i = 0; i < files.length; i++)
        await api("instances.import", { sourcePath: files[i] });
      ui.notifySuccess("Сборка импортирована", files.length > 1 ? "Импортировано файлов: " + files.length : "");
      App.reload();
    } catch (e) { ui.notifyError(e, "Не удалось импортировать сборку"); }
  }

  function versionChipHtml(inst) {
    var logo = LOADER_LOGOS[inst.loader];
    return '<button class="home-pchip" data-act="ver" type="button">' +
      (logo ? '<img class="pc-logo" src="' + logo + '" alt="" />' : "") +
      '<span class="pc-label">' + ui.esc(inst.mcVersion) +
      '<span class="pc-sub"> · ' + ui.esc(LOADER_LABELS[inst.loader] || inst.loader || "Vanilla") + "</span></span>" +
      ui.icon("chevron") + "</button>";
  }

  function renderHero(box, inst) {
    if (!inst) { S.activeId = null; S.playBtn = null; renderWelcome(box); return; }
    S.activeId = inst.id;
    var color = inst.color || "#3ecf8e";
    var letter = ui.esc((inst.name || "?").trim().charAt(0).toUpperCase() || "?");
    box.innerHTML =
      '<div class="hero">' +
        /* фон героя — всегда обложка-арт (assets/hero.png), иконка сборки живёт только в квадрате дока */
        '<div class="hero-clip"><div class="hero-bg"></div><div class="hero-shade"></div></div>' +
        '<div class="hero-body">' +
          '<div class="hero-badge">' + ui.icon("play") + " Продолжить игру</div>" +
          '<h2 class="hero-title"><span>' + ui.esc(inst.name) + "</span>" + (inst.favorite ? ui.icon("star", "fav") : "") + "</h2>" +
          '<div class="hero-sub">' +
            '<span class="chip">Minecraft ' + ui.esc(inst.mcVersion) + "</span>" +
            loaderChip(inst.loader, inst.loaderVersion) +
            '<span class="chip">' + ui.icon("clock") + " " + ui.esc(ui.fmtRelative(inst.lastPlayedAt)) + "</span>" +
          "</div>" +
        "</div>" +
        '<div class="hero-dock">' +
          '<div class="hero-panel" id="home-hero-actions">' +
            versionChipHtml(inst) +
            '<div class="hero-status" id="home-status" hidden>' +
              '<div class="progress indeterminate"><i style="width:35%"></i></div>' +
              '<div class="st-text"><span class="spinner" style="width:12px;height:12px"></span><span id="home-status-text">Запуск…</span>' +
                '<span class="dim tnum" id="home-status-meta" style="margin-left:auto"></span></div>' +
            "</div>" +
            '<span class="spacer"></span>' +
            '<button class="btn btn-danger" data-act="stop" hidden>' + ui.icon("power") + " Остановить</button>" +
            '<button class="btn play btn-lg" data-play-quick data-act="play">' + ui.icon("play") + " Играть</button>" +
          "</div>" +
          '<button class="hero-icon" data-act="open" title="Открыть сборку"><span class="item-icon" style="background:' + ui.esc(color) + ';color:#08130d">' + letter + "</span></button>" +
        "</div>" +
      "</div>";

    S.playBtn = box.querySelector('[data-act="play"]');
    S.playBtn.onclick = function () { startLaunch(inst.id); };
    var stopBtn = box.querySelector('[data-act="stop"]');
    if (stopBtn) stopBtn.onclick = stopLaunch;
    box.querySelector('[data-act="open"]').onclick = function () { navigate("instance", { id: inst.id }); };
    box.querySelector('[data-act="ver"]').onclick = function (ev) { openVersionMenu(ev.currentTarget, inst.id); };

    /* иконка сборки в маленьком квадрате дока (реальный файл, отдаётся IPC как data URL) */
    var iconBox = box.querySelector(".hero-icon");
    api("instances.image", { id: inst.id, kind: "icon" }).then(function (url) {
      if (S.dead || !iconBox.isConnected || !url) return;
      iconBox.innerHTML = '<img src="' + url + '" alt="" />';
    }).catch(function () { /* без картинки — остаётся буквенная плитка */ });
    applyRunningUI();
  }

  function openVersionMenu(anchor, currentId) {
    var r = anchor.getBoundingClientRect();
    var items = [{ label: "Сборка для запуска", header: true }];
    if (!S.list.length) items.push({ label: "Сборок пока нет", disabled: true });
    S.list.slice(0, 12).forEach(function (i) {
      items.push({
        label: i.name + " · " + i.mcVersion,
        icon: i.id === currentId ? "check" : "cube",
        onClick: function () { selectActive(i.id); },
      });
    });
    if (S.list.length > 12) { items.push("-"); items.push({ label: "Все сборки…", icon: "grid", onClick: function () { navigate("instances"); } }); }
    ui.contextMenu(r.left, r.bottom + 8, items);
  }

  async function selectActive(id) {
    try {
      await api("settings.set", { activeInstance: id });
      var inst = S.list.filter(function (i) { return i.id === id; })[0];
      if (inst) renderHero(document.getElementById("home-hero"), inst);
    } catch (e) { ui.notifyError(e, "Не удалось сменить сборку"); }
  }

  function setStatus(text, percent, meta) {
    var box = document.getElementById("home-status");
    if (!box) return;
    box.hidden = false;
    var t = document.getElementById("home-status-text");
    if (t) t.textContent = text || "Запуск…";
    var bar = box.querySelector(".progress");
    if (bar) {
      if (typeof percent === "number" && percent >= 0) {
        bar.classList.remove("indeterminate");
        bar.firstElementChild.style.width = Math.max(3, Math.min(100, percent)) + "%";
      } else bar.classList.add("indeterminate");
    }
    var extra = document.getElementById("home-status-meta");
    if (extra) {
      var parts = [];
      if (typeof percent === "number" && percent >= 0) parts.push(percent + "%");
      if (meta) parts = parts.concat(meta);
      extra.textContent = parts.join(" · ");
    }
  }
  /** Строка «скорость · осталось · байты» из события прогресса запуска. */
  function progressMeta(d) {
    var parts = [];
    if (d && d.speedBps > 0) parts.push(ui.fmtSpeed(d.speedBps));
    if (d && d.etaS > 0) parts.push("осталось ~" + ui.fmtEta(d.etaS));
    if (d && d.totalBytes > 0) parts.push(ui.fmtBytes(d.receivedBytes || 0) + " / " + ui.fmtBytes(d.totalBytes));
    return parts;
  }
  function hideStatus() {
    var box = document.getElementById("home-status");
    if (box) box.hidden = true;
    var bar = box && box.querySelector(".progress");
    if (bar) { bar.classList.add("indeterminate"); bar.firstElementChild.style.width = "35%"; }
  }
  function setPlayLoading(on) {
    if (S.playBtn) S.playBtn.classList.toggle("loading", !!on);
  }

  async function startLaunch(id) {
    setPlayLoading(true);
    setStatus("Проверка файлов…");
    try {
      await api("launch.start", { instanceId: id });
      setStatus("Запуск Minecraft…");
    } catch (e) {
      setPlayLoading(false);
      hideStatus();
      ui.notifyError(e, "Не удалось запустить сборку");
    } finally {
      refreshRunning();
    }
  }

  async function stopLaunch() {
    var hero = runningOf(S.activeId);
    if (!hero) return;
    try {
      var res = await api("launch.stop", { instanceId: S.activeId });
      if (res && res.wasPreparing) ui.notifyInfo("Запуск отменён", "Подготовка остановлена");
      else ui.notifyInfo("Остановка", "Завершение процесса Minecraft…");
    } catch (e) { ui.notifyError(e, "Не удалось остановить игру"); }
    refreshRunning();
  }

  /* ---------- состояние запуска ---------- */

  function runningOf(id) { return S.running.filter(function (x) { return x.instanceId === id; })[0] || null; }
  function otherRunning(id) { return S.running.filter(function (x) { return x.instanceId !== id; })[0] || null; }

  async function refreshRunning() {
    try {
      var r = await api("launch.running");
      if (S.dead) return;
      S.running = (r && r.items) || [];
      S.runningLimit = (r && r.limit) || 1;
      applyRunningUI();
    } catch (e) { /* noop */ }
  }

  function applyRunningUI() {
    var mine = runningOf(S.activeId);
    var other = otherRunning(S.activeId);

    var note = document.getElementById("home-note");
    if (note) {
      if (other) {
        note.hidden = false;
        note.innerHTML = '<div class="banner warn" style="margin-top:2px">' + ui.icon("play") + "<span class=\"grow\">Уже запущена «" + ui.esc(other.name) + "»" +
          (other.preparing ? " (идёт подготовка)" : "") + " — одновременно можно держать " + S.runningLimit + " сборку.</span>" +
          '<button class="btn btn-sm btn-danger" data-act="stop-other">Остановить</button></div>';
        var b = note.querySelector('[data-act="stop-other"]');
        if (b) b.onclick = function () {
          var id = other.instanceId;
          api("launch.stop", { instanceId: id }).catch(function (e) { ui.notifyError(e, "Не удалось остановить игру"); })
            .then(function () { refreshRunning(); });
        };
      } else {
        note.hidden = true;
        note.innerHTML = "";
      }
    }

    var stopBtn = document.querySelector('#home-hero-actions [data-act="stop"]');
    if (stopBtn) stopBtn.hidden = !mine;
    if (S.playBtn) {
      S.playBtn.disabled = !!other || !!mine;
      S.playBtn.title = other ? ("Уже запущена «" + other.name + "»") : (mine ? "Сборка уже запущена" : "");
    }
    if (mine && mine.preparing) {
      setStatus("Идёт подготовка запуска…", undefined);
      setPlayLoading(true);
    }
  }

  /* ---------- register ---------- */
  Pages.register("home", {
    title: "Главная",
    async init(ctx) {
      S.dead = false;
      var root = ctx.root;
      var hero = root.querySelector("#home-hero");

      hero.innerHTML = '<div class="hero">' +
        '<div class="hero-clip"><div class="hero-bg"></div><div class="hero-shade"></div></div>' +
        '<div class="hero-body">' +
        '<div class="skeleton" style="height:16px;width:130px;background:rgba(255,255,255,.25)"></div>' +
        '<div class="skeleton" style="height:32px;width:320px;max-width:70%;background:rgba(255,255,255,.25)"></div>' +
        "</div></div>";

      /* события запуска */
      S.unsubs.push(on("launch.progress", function (d) {
        if (!d || d.instanceId !== S.activeId) return;
        if (!S.playBtn) return;
        setPlayLoading(true);
        setStatus(d.message || d.stage || "Запуск…",
          typeof d.percent === "number" ? d.percent : undefined, progressMeta(d));
      }));
      S.unsubs.push(on("launch.state", function (d) {
        if (!d) return;
        refreshRunning();
        if (d.instanceId !== S.activeId) return;
        setPlayLoading(false);
        var failed = !!d.error || (typeof d.exitCode === "number" && d.exitCode !== 0);
        var running = /run|prep|start|launch|load/i.test(String(d.state || "")) && !failed && typeof d.exitCode !== "number";
        if (running) {
          setStatus(String(d.state || "").toLowerCase() === "preparing" ? "Идёт подготовка запуска…" : "Minecraft запущен и работает");
          return;
        }
        if (!failed && String(d.state || "") === "idle") {
          // запуск отменён пользователем во время подготовки — это не ошибка
          setStatus("Запуск отменён", 0);
          ui.notifyInfo("Запуск отменён", "Подготовка и скачивание файлов остановлены");
          setTimeout(hideStatus, 4000);
          return;
        }
        if (failed) {
          setStatus("Minecraft завершился с ошибкой" + (typeof d.exitCode === "number" ? " · Exit Code " + d.exitCode : ""), 100);
          ui.notifyError(d.error || ("Exit Code " + d.exitCode), "Minecraft завершился с ошибкой");
        } else {
          setStatus("Minecraft завершён, Exit Code 0", 100);
          ui.notifySuccess("Сессия завершена", "Minecraft завершён, Exit Code 0");
        }
        setTimeout(hideStatus, 6000);
      }));

      var list = [];
      try {
        list = (await api("instances.list")) || [];
      } catch (e) {
        hero.innerHTML = '<div class="hero"><div class="hero-clip"><div class="hero-bg"></div><div class="hero-shade"></div></div>' +
          '<div class="hero-body" style="max-width:none">' + errBlock(e, true) + "</div></div>";
        bindRetry(hero, function () { ctx.reload(); });
        return;
      }
      S.list = list;

      renderHero(hero, pickActive(list));

      // состояние запуска показываем сразу и поддерживаем в актуальном виде
      refreshRunning();
      if (S.runTimer) clearInterval(S.runTimer);
      S.runTimer = setInterval(function () { if (!S.dead) refreshRunning(); }, 5000);
    },
    dispose() {
      S.dead = true;
      if (S.runTimer) { clearInterval(S.runTimer); S.runTimer = null; }
      S.unsubs.forEach(function (u) { try { u(); } catch (e) { /* noop */ } });
      S.unsubs = [];
      S.playBtn = null;
      S.activeId = null;
      S.running = [];
      S.list = [];
    },
  });
})();
</script>
